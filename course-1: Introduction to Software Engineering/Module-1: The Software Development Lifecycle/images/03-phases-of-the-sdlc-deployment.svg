<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">Phase 5: Staged Deployment</text>
  <text x="450" y="72" text-anchor="middle" font-size="15" fill="#6b7280">Customer checks on UAT first, real users get it only after sign-off</text>

  <!-- tested build -->
  <rect x="330" y="95" width="240" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="121" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">Tested build</text>
  <text x="450" y="140" text-anchor="middle" font-size="12" fill="#78350f">from the testing phase</text>
  <line x1="450" y1="151" x2="450" y2="185" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- UAT -->
  <rect x="250" y="190" width="400" height="110" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="450" y="222" text-anchor="middle" font-size="20" font-weight="bold" fill="#5b21b6">UAT Platform</text>
  <text x="450" y="246" text-anchor="middle" font-size="13" fill="#4c1d95">User Acceptance Testing</text>
  <text x="450" y="268" text-anchor="middle" font-size="13" fill="#4c1d95">copy of production, no real users</text>
  <text x="450" y="288" text-anchor="middle" font-size="13" fill="#4c1d95">customer tests the functionality</text>

  <!-- loop back: sign-off refused -> fix and retest on UAT -->
  <path d="M560 380 Q 760 380 760 300 Q 760 245 655 245" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="772" y="310" font-size="13" fill="#991b1b">no: fix</text>
  <text x="772" y="326" font-size="13" fill="#991b1b">and retest</text>
  <text x="470" y="440" font-size="13" fill="#166534">yes</text>

  <line x1="450" y1="300" x2="450" y2="335" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- sign-off -->
  <polygon points="450,340 560,380 450,420 340,380" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="385" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Customer sign-off</text>
  <line x1="450" y1="420" x2="450" y2="450" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- production -->
  <rect x="250" y="455" width="400" height="56" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="450" y="490" text-anchor="middle" font-size="20" font-weight="bold" fill="#991b1b">Production: real users</text>

  <line x1="330" y1="511" x2="170" y2="545" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="511" x2="450" y2="545" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="511" x2="730" y2="545" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="60" y="550" width="220" height="50" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="170" y="580" fill="#075985">Website</text>
    <rect x="340" y="550" width="220" height="50" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="450" y="580" fill="#075985">Mobile app store</text>
    <rect x="620" y="550" width="220" height="50" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="730" y="572" fill="#075985">Corporate network</text>
    <text x="730" y="590" font-size="12" font-weight="normal" fill="#0c4a6e">distribution server</text>
  </g>
</svg>
