<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">The SDLC: A Repeating Cycle</text>
  <text x="450" y="72" text-anchor="middle" font-size="15" fill="#6b7280">Systematic process → high-quality software, predictable time and budget</text>

  <!-- client requirements -->
  <rect x="330" y="95" width="240" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">Client business requirements</text>
  <line x1="450" y1="145" x2="450" y2="180" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- cycle circle -->
  <circle cx="450" cy="370" r="150" fill="none" stroke="#d1d5db" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Planning (top) -->
  <rect x="370" y="185" width="160" height="62" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="214" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e40af">Planning</text>
  <text x="450" y="235" text-anchor="middle" font-size="12" fill="#1e3a8a">deliverable: plan + requirements</text>

  <!-- Design (bottom right) -->
  <rect x="560" y="420" width="160" height="62" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="640" y="449" text-anchor="middle" font-size="18" font-weight="bold" fill="#5b21b6">Design</text>
  <text x="640" y="470" text-anchor="middle" font-size="12" fill="#4c1d95">deliverable: design docs</text>

  <!-- Development (bottom left) -->
  <rect x="180" y="420" width="160" height="62" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="260" y="449" text-anchor="middle" font-size="18" font-weight="bold" fill="#166534">Development</text>
  <text x="260" y="470" text-anchor="middle" font-size="12" fill="#14532d">deliverable: working code</text>

  <!-- arrows -->
  <path d="M530 230 Q 620 290 630 415" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M560 465 Q 450 520 345 465" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M250 415 Q 270 290 365 230" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="225" y="320" text-anchor="middle" font-size="13" fill="#374151" transform="rotate(-62 225 320)">iterate: new requirements</text>

  <text x="450" y="365" text-anchor="middle" font-size="20" font-weight="bold" fill="#374151">SDLC</text>
  <text x="450" y="390" text-anchor="middle" font-size="13" fill="#6b7280">each phase = own process</text>
  <text x="450" y="408" text-anchor="middle" font-size="13" fill="#6b7280">+ own deliverables</text>

  <!-- output -->
  <line x1="260" y1="482" x2="260" y2="555" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="140" y="560" width="620" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="591" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">High-quality, deployable software • lower risk • lower cost</text>
</svg>
