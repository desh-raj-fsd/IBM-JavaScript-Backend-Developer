<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">The Six Categories of CASE Tools</text>
  <text x="450" y="72" text-anchor="middle" font-size="15" fill="#6b7280">CASE = Computer-Aided Software Engineering (rose in the mid-1980s)</text>

  <!-- spokes -->
  <g stroke="#cbd5e1" stroke-width="3">
    <line x1="450" y1="340" x2="190" y2="190"/>
    <line x1="450" y1="340" x2="450" y2="150"/>
    <line x1="450" y1="340" x2="710" y2="190"/>
    <line x1="450" y1="340" x2="190" y2="490"/>
    <line x1="450" y1="340" x2="450" y2="530"/>
    <line x1="450" y1="340" x2="710" y2="490"/>
  </g>

  <!-- center -->
  <circle cx="450" cy="340" r="78" fill="#1e3a8a"/>
  <text x="450" y="335" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">CASE</text>
  <text x="450" y="360" text-anchor="middle" font-size="13" fill="#dbeafe">helped relieve the</text>
  <text x="450" y="377" text-anchor="middle" font-size="13" fill="#dbeafe">software crisis</text>

  <!-- nodes -->
  <g font-size="15" text-anchor="middle">
    <rect x="70" y="150" width="240" height="80" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="190" y="182" font-weight="bold" fill="#1e3a8a">1. Business analysis</text>
    <text x="190" y="204" font-weight="bold" fill="#1e3a8a">and modeling</text>

    <rect x="330" y="110" width="240" height="80" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="450" y="142" font-weight="bold" fill="#14532d">2. Development tools</text>
    <text x="450" y="164" fill="#14532d">e.g. debugging environments</text>

    <rect x="590" y="150" width="240" height="80" rx="14" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
    <text x="710" y="182" font-weight="bold" fill="#713f12">3. Verification and</text>
    <text x="710" y="204" font-weight="bold" fill="#713f12">validation</text>

    <rect x="70" y="450" width="240" height="80" rx="14" fill="#fae8ff" stroke="#c026d3" stroke-width="2"/>
    <text x="190" y="482" font-weight="bold" fill="#701a75">4. Configuration</text>
    <text x="190" y="504" font-weight="bold" fill="#701a75">management</text>

    <rect x="330" y="490" width="240" height="80" rx="14" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
    <text x="450" y="522" font-weight="bold" fill="#7c2d12">5. Metrics and</text>
    <text x="450" y="544" font-weight="bold" fill="#7c2d12">measurement</text>

    <rect x="590" y="450" width="240" height="80" rx="14" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="710" y="482" font-weight="bold" fill="#312e81">6. Project</text>
    <text x="710" y="504" font-weight="bold" fill="#312e81">management</text>
  </g>
</svg>
