<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">Release Stages: Alpha → Beta → GA</text>
  <text x="450" y="72" text-anchor="middle" font-size="15" fill="#6b7280">The audience grows as the software becomes more stable</text>
  <g font-size="13">
    <rect x="40" y="110" width="250" height="300" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="165" y="145" text-anchor="middle" font-size="22" font-weight="bold" fill="#991b1b">Alpha</text>
    <circle cx="165" cy="190" r="22" fill="#fca5a5"/>
    <text x="165" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">few</text>
    <text x="165" y="240" text-anchor="middle" fill="#7f1d1d">Audience: select stakeholders</text>
    <text x="165" y="264" text-anchor="middle" fill="#7f1d1d">First functioning version</text>
    <text x="165" y="288" text-anchor="middle" fill="#7f1d1d">Most features, not all</text>
    <text x="165" y="312" text-anchor="middle" fill="#7f1d1d">Likely contains errors</text>
    <text x="165" y="336" text-anchor="middle" fill="#7f1d1d">Design may still change</text>
    <text x="165" y="385" text-anchor="middle" font-family="Menlo, monospace" fill="#991b1b">1.0.0-alpha.1</text>

    <rect x="325" y="110" width="250" height="300" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="450" y="145" text-anchor="middle" font-size="22" font-weight="bold" fill="#92400e">Beta</text>
    <circle cx="420" cy="190" r="18" fill="#fcd34d"/><circle cx="450" cy="190" r="18" fill="#fcd34d"/><circle cx="480" cy="190" r="18" fill="#fcd34d"/>
    <text x="450" y="240" text-anchor="middle" fill="#78350f">Also: limited release</text>
    <text x="450" y="264" text-anchor="middle" fill="#78350f">Audience: outside the org</text>
    <text x="450" y="288" text-anchor="middle" fill="#78350f">All functional requirements</text>
    <text x="450" y="312" text-anchor="middle" fill="#78350f">Real conditions testing</text>
    <text x="450" y="336" text-anchor="middle" fill="#78350f">Find outstanding bugs</text>
    <text x="450" y="385" text-anchor="middle" font-family="Menlo, monospace" fill="#92400e">1.0.0-beta.1</text>

    <rect x="610" y="110" width="250" height="300" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="735" y="145" text-anchor="middle" font-size="22" font-weight="bold" fill="#166534">GA</text>
    <g fill="#86efac"><circle cx="685" cy="190" r="14"/><circle cx="710" cy="190" r="14"/><circle cx="735" cy="190" r="14"/><circle cx="760" cy="190" r="14"/><circle cx="785" cy="190" r="14"/></g>
    <text x="735" y="240" text-anchor="middle" fill="#14532d">General Availability</text>
    <text x="735" y="264" text-anchor="middle" fill="#14532d">Audience: ALL users</text>
    <text x="735" y="288" text-anchor="middle" fill="#14532d">Beta changes agreed,</text>
    <text x="735" y="312" text-anchor="middle" fill="#14532d">made and tested</text>
    <text x="735" y="336" text-anchor="middle" fill="#14532d">Stable version</text>
    <text x="735" y="385" text-anchor="middle" font-family="Menlo, monospace" fill="#166534">1.0.0</text>
  </g>
  <g stroke="#4b5563" stroke-width="3" marker-end="url(#a)"><line x1="292" y1="260" x2="321" y2="260"/><line x1="577" y1="260" x2="606" y2="260"/></g>
  <rect x="40" y="440" width="820" height="90" rx="12" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="450" y="468" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">Modern practice (not in the lecture)</text>
  <text x="450" y="492" text-anchor="middle" font-size="13" fill="#374151">SemVer pre-release tags (-alpha, -beta, -rc) · feature flags: staff → 5% → 100% of users</text>
  <text x="450" y="512" text-anchor="middle" font-size="13" fill="#374151">canary and blue-green deployments · always keep a rollback plan</text>
</svg>
