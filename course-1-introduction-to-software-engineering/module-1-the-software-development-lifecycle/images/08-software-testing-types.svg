<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#1f2937">Three Questions That Classify Any Test</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#6b7280">Functional vs. non-functional is WHAT; black-box vs. white-box is HOW; regression is WHY NOW</text>

  <!-- WHAT -->
  <rect x="24" y="86" width="852" height="150" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="44" y="112" font-size="16" font-weight="bold" fill="#1f2937">1. WHAT does it check?</text>
  <rect x="44" y="124" width="390" height="98" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="239" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Functional — what it does</text>
  <text x="60" y="172" font-size="12" fill="#1e3a8a">• features against functional requirements</text>
  <text x="60" y="192" font-size="12" fill="#1e3a8a">• inputs → expected outputs, error messages</text>
  <text x="60" y="212" font-size="12" fill="#1e3a8a">• "rating 6 → 400"</text>
  <rect x="466" y="124" width="390" height="98" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="661" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">Non-functional — how well</text>
  <text x="482" y="172" font-size="12" fill="#4c1d95">• performance, security, scalability, availability</text>
  <text x="482" y="192" font-size="12" fill="#4c1d95">• usability, accessibility, compatibility, recovery</text>
  <text x="482" y="212" font-size="12" fill="#4c1d95">• "p95 under 300 ms with 500 users"</text>

  <!-- HOW -->
  <rect x="24" y="250" width="852" height="140" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="44" y="276" font-size="16" font-weight="bold" fill="#1f2937">2. HOW is it designed?</text>
  <rect x="44" y="288" width="260" height="88" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <rect x="64" y="304" width="40" height="40" fill="#374151"/>
  <text x="194" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">Black-box</text>
  <text x="194" y="338" text-anchor="middle" font-size="12" fill="#374151">inputs and outputs only</text>
  <text x="194" y="358" text-anchor="middle" font-size="11" fill="#6b7280">functional, system, acceptance</text>
  <rect x="320" y="288" width="260" height="88" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <rect x="340" y="304" width="40" height="40" fill="#9ca3af"/>
  <text x="470" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">Grey-box</text>
  <text x="470" y="338" text-anchor="middle" font-size="12" fill="#374151">outside test, inside knowledge</text>
  <text x="470" y="358" text-anchor="middle" font-size="11" fill="#6b7280">often integration</text>
  <rect x="596" y="288" width="260" height="88" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <rect x="616" y="304" width="40" height="40" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="746" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">White-box</text>
  <text x="746" y="338" text-anchor="middle" font-size="12" fill="#374151">uses the code: branches</text>
  <text x="746" y="358" text-anchor="middle" font-size="11" fill="#6b7280">mostly unit tests</text>

  <!-- WHY -->
  <rect x="24" y="404" width="852" height="150" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="44" y="430" font-size="16" font-weight="bold" fill="#1f2937">3. WHY does it run now?</text>
  <rect x="44" y="442" width="260" height="98" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="174" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">New test</text>
  <text x="174" y="488" text-anchor="middle" font-size="12" fill="#14532d">a new feature or requirement</text>
  <rect x="320" y="442" width="260" height="98" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Confirmation (re-test)</text>
  <text x="450" y="488" text-anchor="middle" font-size="12" fill="#78350f">is the fixed defect really gone?</text>
  <rect x="596" y="442" width="260" height="98" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="726" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Regression</text>
  <text x="726" y="488" text-anchor="middle" font-size="12" fill="#7f1d1d">after ANY change: did something</text>
  <text x="726" y="506" text-anchor="middle" font-size="12" fill="#7f1d1d">old break? re-runs functional</text>
  <text x="726" y="524" text-anchor="middle" font-size="12" fill="#7f1d1d">AND non-functional tests</text>

  <text x="450" y="582" text-anchor="middle" font-size="12" fill="#374151">Maintenance testing = testing changes to live software; it includes confirmation and regression testing</text>
</svg>
