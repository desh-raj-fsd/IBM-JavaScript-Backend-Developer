<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="900" height="700" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">The Six Phases of the SDLC</text>
  <text x="450" y="72" text-anchor="middle" font-size="15" fill="#6b7280">Each phase has its own tasks and its own output</text>

  <circle cx="450" cy="385" r="215" fill="none" stroke="#d1d5db" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="450" y="372" text-anchor="middle" font-size="22" font-weight="bold" fill="#374151">SDLC</text>
  <text x="450" y="396" text-anchor="middle" font-size="13" fill="#6b7280">Software Development</text>
  <text x="450" y="414" text-anchor="middle" font-size="13" fill="#6b7280">Life Cycle</text>

  <!-- 1 Planning (top) -->
  <rect x="345" y="105" width="210" height="72" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="134" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e40af">1. Planning</text>
  <text x="450" y="156" text-anchor="middle" font-size="13" fill="#1e3a8a">output: SRS</text>

  <!-- 2 Design (top right) -->
  <rect x="610" y="225" width="210" height="72" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="715" y="254" text-anchor="middle" font-size="18" font-weight="bold" fill="#5b21b6">2. Design</text>
  <text x="715" y="276" text-anchor="middle" font-size="13" fill="#4c1d95">output: design document</text>

  <!-- 3 Development (bottom right) -->
  <rect x="610" y="470" width="210" height="72" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="715" y="499" text-anchor="middle" font-size="18" font-weight="bold" fill="#166534">3. Development</text>
  <text x="715" y="521" text-anchor="middle" font-size="13" fill="#14532d">output: source code</text>

  <!-- 4 Testing (bottom) -->
  <rect x="345" y="590" width="210" height="72" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="619" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">4. Testing</text>
  <text x="450" y="641" text-anchor="middle" font-size="13" fill="#78350f">output: stable software</text>

  <!-- 5 Deployment (bottom left) -->
  <rect x="80" y="470" width="210" height="72" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="185" y="499" text-anchor="middle" font-size="18" font-weight="bold" fill="#991b1b">5. Deployment</text>
  <text x="185" y="521" text-anchor="middle" font-size="13" fill="#7f1d1d">output: live in production</text>

  <!-- 6 Maintenance (top left) -->
  <rect x="80" y="225" width="210" height="72" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="185" y="254" text-anchor="middle" font-size="18" font-weight="bold" fill="#075985">6. Maintenance</text>
  <text x="185" y="276" text-anchor="middle" font-size="13" fill="#0c4a6e">output: feedback, fixes</text>

  <!-- arrows clockwise -->
  <path d="M555 150 Q 640 170 690 220" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="715" y1="297" x2="715" y2="465" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M690 542 Q 640 600 560 620" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M345 620 Q 260 600 210 547" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="185" y1="470" x2="185" y2="302" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M210 225 Q 260 170 340 150" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="235" y="172" text-anchor="middle" font-size="13" fill="#374151">next cycle</text>
</svg>
