<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
  <rect width="900" height="720" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">The Requirement Gathering Process</text>
  <text x="450" y="68" text-anchor="middle" font-size="15" fill="#6b7280">Six steps — steps 3, 4 and 5 are repeated until the requirements are approved</text>
  <g font-size="13">
    <rect x="250" y="90" width="400" height="66" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="450" y="117" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e40af">1. Identify stakeholders</text>
    <text x="450" y="140" text-anchor="middle" fill="#1e3a8a">decision-makers · end users · admins · engineering · marketing · sales · support</text>

    <rect x="250" y="180" width="400" height="66" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="450" y="207" text-anchor="middle" font-size="17" font-weight="bold" fill="#5b21b6">2. Establish goals and objectives</text>
    <text x="450" y="230" text-anchor="middle" fill="#4c1d95">goals = broad, long-term · objectives = specific, measurable</text>

    <rect x="120" y="275" width="660" height="250" rx="18" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="140" y="300" font-size="14" font-weight="bold" fill="#4b5563">Iterative loop</text>

    <rect x="250" y="310" width="400" height="56" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="450" y="334" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">3. Elicit</text>
    <text x="450" y="354" text-anchor="middle" fill="#14532d">surveys · questionnaires · interviews</text>

    <rect x="250" y="380" width="400" height="56" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="450" y="404" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400e">4. Document</text>
    <text x="450" y="424" text-anchor="middle" fill="#78350f">easy to understand · aligned with goals and objectives</text>

    <rect x="250" y="450" width="400" height="56" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="450" y="474" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">5. Analyze and confirm</text>
    <text x="450" y="494" text-anchor="middle" fill="#7f1d1d">consistent · clear · complete → approved by stakeholders</text>

    <rect x="250" y="550" width="400" height="66" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="450" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#075985">6. Prioritize</text>
    <text x="450" y="600" text-anchor="middle" fill="#0c4a6e">must-have → highly desired → nice to have (ordered inside each)</text>
  </g>
  <g stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)">
    <line x1="450" y1="156" x2="450" y2="176"/><line x1="450" y1="246" x2="450" y2="306"/>
    <line x1="450" y1="366" x2="450" y2="376"/><line x1="450" y1="436" x2="450" y2="446"/>
    <line x1="450" y1="506" x2="450" y2="546"/>
  </g>
  <path d="M650,478 L720,478 L720,338 L654,338" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="730" y="400" font-size="12" fill="#991b1b">gaps or</text>
  <text x="730" y="416" font-size="12" fill="#991b1b">conflicts</text>
  <text x="560" y="535" font-size="12" fill="#075985">approved</text>
  <rect x="150" y="640" width="600" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="450" y="663" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Output: SRS (most common) · URS · SysRS</text>
  <text x="450" y="684" text-anchor="middle" font-size="13" fill="#374151">Modern teams repeat steps 3–6 every sprint (continuous discovery)</text>
</svg>
