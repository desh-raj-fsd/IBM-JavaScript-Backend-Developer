<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#1f2937">Software Documentation: Two Categories</text>
  <text x="450" y="60" text-anchor="middle" font-size="14" fill="#6b7280">Product documentation is about the product; process documentation is about how we work</text>

  <rect x="330" y="74" width="240" height="44" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="450" y="102" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Software documentation</text>
  <g stroke="#4b5563" stroke-width="2" fill="none">
    <path d="M400,118 L240,150"/>
    <path d="M500,118 L660,150"/>
  </g>

  <!-- Product column -->
  <rect x="40" y="150" width="400" height="56" rx="8" fill="#1e40af"/>
  <text x="240" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">PRODUCT documentation</text>
  <text x="240" y="194" text-anchor="middle" font-size="12" fill="#dbeafe">What it is, how it is built, tested and used</text>
  <g font-size="12">
    <rect x="40" y="222" width="400" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="58" y="242" font-size="14" font-weight="bold" fill="#1e3a8a">1. Requirements</text>
    <text x="58" y="261" fill="#1e3a8a">SRS, SysRS, URS · user stories, PRD</text>
    <rect x="40" y="282" width="400" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="58" y="302" font-size="14" font-weight="bold" fill="#1e3a8a">2. Design</text>
    <text x="58" y="321" fill="#1e3a8a">conceptual + technical · C4, ADRs, OpenAPI</text>
    <rect x="40" y="342" width="400" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="58" y="362" font-size="14" font-weight="bold" fill="#1e3a8a">3. Technical</text>
    <text x="58" y="381" fill="#1e3a8a">code comments, README, API reference</text>
    <rect x="40" y="402" width="400" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="58" y="422" font-size="14" font-weight="bold" fill="#1e3a8a">4. QA (Quality Assurance)</text>
    <text x="58" y="441" fill="#1e3a8a">strategy, plans, cases, data, traceability</text>
    <rect x="40" y="462" width="400" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="58" y="482" font-size="14" font-weight="bold" fill="#1e3a8a">5. User</text>
    <text x="58" y="501" fill="#1e3a8a">FAQ, install and help guides, tutorials, manuals</text>
  </g>

  <!-- Process column -->
  <rect x="460" y="150" width="400" height="56" rx="8" fill="#b45309"/>
  <text x="660" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">PROCESS documentation</text>
  <text x="660" y="194" text-anchor="middle" font-size="12" fill="#fef3c7">How the work is planned, done and recorded</text>
  <g font-size="12">
    <rect x="460" y="222" width="400" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="478" y="242" font-size="14" font-weight="bold" fill="#78350f">Plans and schedules</text>
    <text x="478" y="261" fill="#78350f">project plan, sprint goals, estimates</text>
    <rect x="460" y="282" width="400" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="478" y="302" font-size="14" font-weight="bold" fill="#78350f">Standards</text>
    <text x="478" y="321" fill="#78350f">coding standards, Definition of Done</text>
    <rect x="460" y="342" width="400" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="478" y="362" font-size="14" font-weight="bold" fill="#78350f">Reports and notes</text>
    <text x="478" y="381" fill="#78350f">status reports, meeting notes, working papers</text>
    <rect x="460" y="402" width="400" height="50" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="478" y="422" font-size="14" font-weight="bold" fill="#78350f">SOPs (Standard Operating Procedures)</text>
    <text x="478" y="441" fill="#78350f">exact, step-by-step, organization-specific</text>
    <rect x="460" y="462" width="400" height="50" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="660" y="483" text-anchor="middle" font-size="13" fill="#78350f">Process docs give the overview;</text>
    <text x="660" y="502" text-anchor="middle" font-size="13" fill="#78350f">SOPs give the exact steps</text>
  </g>

  <text x="450" y="542" text-anchor="middle" font-size="12" fill="#6b7280">Formats for both: written, video, graphical, and today also interactive and machine-readable (OpenAPI)</text>
</svg>
