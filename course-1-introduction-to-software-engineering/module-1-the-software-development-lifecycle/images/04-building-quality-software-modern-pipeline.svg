<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
  <rect width="900" height="760" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">The Modern Quality Pipeline</text>
  <text x="450" y="68" text-anchor="middle" font-size="15" fill="#6b7280">Every stage has an automated quality gate. Fail a gate → stop and fix.</text>
  <g font-size="13">
    <rect x="60" y="90" width="560" height="74" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="118" font-size="17" font-weight="bold" fill="#1e40af">1. Requirements</text>
    <text x="80" y="142" fill="#1e3a8a">user story · acceptance criteria · NFR scenarios · abuse cases</text>
    <rect x="640" y="104" width="200" height="46" rx="23" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="740" y="132" text-anchor="middle" font-weight="bold" fill="#9a3412">Gate: Definition of Ready</text>

    <rect x="60" y="184" width="560" height="74" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="80" y="212" font-size="17" font-weight="bold" fill="#5b21b6">2. Design</text>
    <text x="80" y="236" fill="#4c1d95">OpenAPI contract · ADR · threat model · ports and adapters</text>
    <rect x="640" y="198" width="200" height="46" rx="23" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="740" y="226" text-anchor="middle" font-weight="bold" fill="#9a3412">Gate: design review</text>

    <rect x="60" y="278" width="560" height="74" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="80" y="306" font-size="17" font-weight="bold" fill="#166534">3. Code</text>
    <text x="80" y="330" fill="#14532d">small PR · lint + format · types · schema validation</text>
    <rect x="640" y="292" width="200" height="46" rx="23" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="740" y="320" text-anchor="middle" font-weight="bold" fill="#9a3412">Gate: code review</text>

    <rect x="60" y="372" width="560" height="74" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="80" y="400" font-size="17" font-weight="bold" fill="#92400e">4. CI tests and scans</text>
    <text x="80" y="424" fill="#78350f">unit · integration · contract · SAST · dependency + secret scan</text>
    <rect x="640" y="386" width="200" height="46" rx="23" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="740" y="414" text-anchor="middle" font-weight="bold" fill="#9a3412">Gate: all checks green</text>

    <rect x="60" y="466" width="560" height="74" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="80" y="494" font-size="17" font-weight="bold" fill="#3730a3">5. Build once</text>
    <text x="80" y="518" fill="#312e81">versioned artifact · SBOM · provenance · signature</text>
    <rect x="640" y="480" width="200" height="46" rx="23" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="740" y="508" text-anchor="middle" font-weight="bold" fill="#9a3412">Gate: signed + SBOM</text>

    <rect x="60" y="560" width="560" height="74" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="80" y="588" font-size="17" font-weight="bold" fill="#991b1b">6. Progressive release</text>
    <text x="80" y="612" fill="#7f1d1d">flags: staff (alpha) → some users (beta) → everyone (GA) · canary</text>
    <rect x="640" y="574" width="200" height="46" rx="23" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="740" y="602" text-anchor="middle" font-weight="bold" fill="#9a3412">Gate: metrics healthy</text>

    <rect x="60" y="654" width="560" height="74" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="80" y="682" font-size="17" font-weight="bold" fill="#075985">7. Operate and learn</text>
    <text x="80" y="706" fill="#0c4a6e">logs · metrics · traces · SLOs · error budget · postmortems</text>
    <rect x="640" y="668" width="200" height="46" rx="23" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="740" y="696" text-anchor="middle" font-weight="bold" fill="#9a3412">Gate: error budget left</text>
  </g>
  <g stroke="#4b5563" stroke-width="2.5" marker-end="url(#a)">
    <line x1="340" y1="164" x2="340" y2="180"/><line x1="340" y1="258" x2="340" y2="274"/>
    <line x1="340" y1="352" x2="340" y2="368"/><line x1="340" y1="446" x2="340" y2="462"/>
    <line x1="340" y1="540" x2="340" y2="556"/><line x1="340" y1="634" x2="340" y2="650"/>
  </g>
  <path d="M60,691 L30,691 L30,127 L56,127" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="22" y="410" font-size="12" fill="#6b7280" transform="rotate(-90 22 410)" text-anchor="middle">feedback → new requirements</text>
  <text x="450" y="750" text-anchor="middle" font-size="12" fill="#6b7280">Documentation (docs as code, runbooks, release notes) is updated at every stage</text>
</svg>
