<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#1f2937">Agile: Short Sprints, Working Code, Feedback</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#6b7280">Every sprint (1–4 weeks) runs the SDLC phases in small amounts and ends with feedback</text>

  <!-- backlog -->
  <rect x="24" y="110" width="150" height="250" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="99" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">Backlog</text>
  <text x="99" y="154" text-anchor="middle" font-size="11" fill="#6b7280">ordered by value</text>
  <g font-size="12" fill="#374151">
    <rect x="38" y="168" width="122" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/>
    <text x="48" y="186">login</text>
    <rect x="38" y="200" width="122" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/>
    <text x="48" y="218">post review</text>
    <rect x="38" y="232" width="122" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/>
    <text x="48" y="250">ratings</text>
    <rect x="38" y="264" width="122" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/>
    <text x="48" y="282">search</text>
    <rect x="38" y="296" width="122" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/>
    <text x="48" y="314">moderation…</text>
  </g>

  <!-- sprints -->
  <g font-size="12" fill="#14532d">
    <rect x="210" y="110" width="200" height="190" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="310" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Sprint 1</text>
    <text x="230" y="164">1 plan</text>
    <text x="230" y="186">2 design</text>
    <text x="230" y="208">3 build</text>
    <text x="230" y="230">4 test (unit and up)</text>
    <text x="230" y="252" font-weight="bold" fill="#92400e">5 review + feedback</text>
    <text x="310" y="286" text-anchor="middle" font-size="11" fill="#14532d">increment: login</text>

    <rect x="450" y="110" width="200" height="190" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="550" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Sprint 2</text>
    <text x="470" y="164">1 plan</text>
    <text x="470" y="186">2 design</text>
    <text x="470" y="208">3 build</text>
    <text x="470" y="230">4 test (unit and up)</text>
    <text x="470" y="252" font-weight="bold" fill="#92400e">5 review + feedback</text>
    <text x="550" y="286" text-anchor="middle" font-size="11" fill="#14532d">+ post review</text>

    <rect x="690" y="110" width="186" height="190" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="783" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Sprint 3</text>
    <text x="710" y="164">1 plan</text>
    <text x="710" y="186">2 design</text>
    <text x="710" y="208">3 build</text>
    <text x="710" y="230">4 test (unit and up)</text>
    <text x="710" y="252" font-weight="bold" fill="#92400e">5 review + feedback</text>
    <text x="783" y="286" text-anchor="middle" font-size="11" fill="#14532d">+ ratings</text>
  </g>
  <g stroke="#4b5563" stroke-width="2" marker-end="url(#arr)">
    <line x1="174" y1="205" x2="206" y2="205"/>
    <line x1="410" y1="205" x2="446" y2="205"/>
    <line x1="650" y1="205" x2="686" y2="205"/>
  </g>

  <!-- feedback loops -->
  <g stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrb)">
    <path d="M310 300 C 310 340, 140 340, 120 362"/>
    <path d="M550 300 C 550 360, 150 370, 140 362"/>
    <path d="M783 300 C 783 380, 170 390, 160 362"/>
  </g>
  <text x="470" y="400" text-anchor="middle" font-size="13" fill="#1e40af">stakeholder feedback re-orders the backlog before the next sprint</text>

  <!-- MVP -->
  <rect x="560" y="430" width="316" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="718" y="458" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">MVP after several sprints</text>
  <text x="718" y="480" text-anchor="middle" font-size="12" fill="#78350f">a basic feature set real users try,</text>
  <text x="718" y="498" text-anchor="middle" font-size="12" fill="#78350f">to validate assumptions about the software</text>
  <line x1="783" y1="300" x2="783" y2="426" stroke="#d97706" stroke-width="2" marker-end="url(#arr)"/>

  <!-- manifesto -->
  <rect x="24" y="430" width="510" height="150" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="279" y="456" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">Agile Manifesto — four values (2001)</text>
  <g font-size="13" fill="#4c1d95">
    <text x="44" y="484"><tspan font-weight="bold">Individuals and interactions</tspan> over processes and tools</text>
    <text x="44" y="506"><tspan font-weight="bold">Working software</tspan> over comprehensive documentation</text>
    <text x="44" y="528"><tspan font-weight="bold">Customer collaboration</tspan> over contract negotiation</text>
    <text x="44" y="550"><tspan font-weight="bold">Responding to change</tspan> over following a plan</text>
  </g>
  <text x="279" y="571" text-anchor="middle" font-size="11" font-style="italic" fill="#6d28d9">the items on the right still have value — the left is valued more</text>

  <text x="718" y="548" text-anchor="middle" font-size="12" fill="#374151">Pros: change is easy; working code every sprint</text>
  <text x="718" y="568" text-anchor="middle" font-size="12" fill="#374151">Cons: up-front budget and schedule are harder</text>
</svg>
