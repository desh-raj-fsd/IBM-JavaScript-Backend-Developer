<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">Building Quality Software</text>
  <text x="450" y="72" text-anchor="middle" font-size="15" fill="#6b7280">Six common software engineering processes, and what each one adds to quality</text>
  <g font-size="13">
    <rect x="60" y="110" width="240" height="150" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e40af">1. Requirements</text>
    <text x="180" y="170" text-anchor="middle" fill="#1e3a8a">SRS + use cases</text>
    <text x="180" y="192" text-anchor="middle" fill="#1e3a8a">functional · external/UI</text>
    <text x="180" y="212" text-anchor="middle" fill="#1e3a8a">system features · non-functional</text>
    <text x="180" y="242" text-anchor="middle" font-weight="bold" fill="#1e40af">build the RIGHT thing</text>

    <rect x="330" y="110" width="240" height="150" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="450" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="#5b21b6">2. Design</text>
    <text x="450" y="170" text-anchor="middle" fill="#4c1d95">tech lead → components</text>
    <text x="450" y="192" text-anchor="middle" fill="#4c1d95">behaviors · boundaries · interactions</text>
    <text x="450" y="212" text-anchor="middle" fill="#4c1d95">rules · API · UI · database</text>
    <text x="450" y="242" text-anchor="middle" font-weight="bold" fill="#5b21b6">a structure devs can code</text>

    <rect x="600" y="110" width="240" height="150" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="720" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="#166534">3. Coding for quality</text>
    <text x="720" y="170" text-anchor="middle" fill="#14532d">standards · patterns · styles</text>
    <text x="720" y="192" text-anchor="middle" fill="#14532d">linters (ESLint)</text>
    <text x="720" y="212" text-anchor="middle" fill="#14532d">helpful comments</text>
    <text x="720" y="242" text-anchor="middle" font-weight="bold" fill="#166534">build the thing RIGHT</text>

    <rect x="600" y="370" width="240" height="150" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="720" y="402" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">4. Testing</text>
    <text x="720" y="430" text-anchor="middle" fill="#78350f">unit → integration → system → UAT</text>
    <text x="720" y="452" text-anchor="middle" fill="#78350f">functional · non-functional</text>
    <text x="720" y="472" text-anchor="middle" fill="#78350f">regression</text>
    <text x="720" y="502" text-anchor="middle" font-weight="bold" fill="#92400e">PROVE it works</text>

    <rect x="330" y="370" width="240" height="150" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="450" y="402" text-anchor="middle" font-size="18" font-weight="bold" fill="#991b1b">5. Releases</text>
    <text x="450" y="430" text-anchor="middle" fill="#7f1d1d">alpha → select stakeholders</text>
    <text x="450" y="452" text-anchor="middle" fill="#7f1d1d">beta → outside the org</text>
    <text x="450" y="472" text-anchor="middle" fill="#7f1d1d">GA → all users</text>
    <text x="450" y="502" text-anchor="middle" font-weight="bold" fill="#991b1b">REDUCE risk</text>

    <rect x="60" y="370" width="240" height="150" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="180" y="402" text-anchor="middle" font-size="18" font-weight="bold" fill="#075985">6. Documenting</text>
    <text x="180" y="430" text-anchor="middle" fill="#0c4a6e">system docs → technical users</text>
    <text x="180" y="452" text-anchor="middle" fill="#0c4a6e">user docs → end users</text>
    <text x="180" y="472" text-anchor="middle" fill="#0c4a6e">README · guides · help</text>
    <text x="180" y="502" text-anchor="middle" font-weight="bold" fill="#075985">people can USE and CHANGE it</text>
  </g>
  <g stroke="#4b5563" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="300" y1="185" x2="326" y2="185"/>
    <line x1="570" y1="185" x2="596" y2="185"/>
    <line x1="720" y1="260" x2="720" y2="366"/>
    <line x1="600" y1="445" x2="574" y2="445"/>
    <line x1="330" y1="445" x2="304" y2="445"/>
    <path d="M180,370 L180,264"/>
  </g>
  <text x="192" y="322" font-size="13" fill="#4b5563">feedback</text>
  <rect x="200" y="560" width="500" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="450" y="582" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Modern teams run all six in small loops,</text>
  <text x="450" y="600" text-anchor="middle" font-size="14" fill="#374151">with checks automated in a CI/CD pipeline</text>
</svg>
