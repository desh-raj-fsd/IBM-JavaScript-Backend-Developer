<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#1f2937">npm Version Ranges</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#6b7280">Which published versions may "npm install" choose for each range in package.json?</text>

  <!-- axis with versions -->
  <line x1="40" y1="120" x2="870" y2="120" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <g font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#374151">
    <circle cx="90" cy="120" r="6" fill="#6b7280"/><text x="90" y="104">4.20.0</text>
    <circle cx="190" cy="120" r="6" fill="#6b7280"/><text x="190" y="104">4.21.0</text>
    <circle cx="290" cy="120" r="6" fill="#6b7280"/><text x="290" y="104">4.21.2</text>
    <circle cx="390" cy="120" r="6" fill="#6b7280"/><text x="390" y="104">4.22.0</text>
    <circle cx="490" cy="120" r="6" fill="#6b7280"/><text x="490" y="104">4.22.1</text>
    <circle cx="610" cy="120" r="6" fill="#dc2626"/><text x="610" y="104">5.0.0</text>
    <circle cx="730" cy="120" r="6" fill="#dc2626"/><text x="730" y="104">5.1.0</text>
    <circle cx="830" cy="120" r="6" fill="#7c3aed"/><text x="830" y="104">6.0.0-beta.1</text>
  </g>
  <line x1="550" y1="84" x2="550" y2="390" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="556" y="86" font-size="11" fill="#991b1b">new MAJOR</text>

  <!-- caret -->
  <text x="40" y="176" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="bold" fill="#166534">^4.21.0</text>
  <rect x="180" y="190" width="350" height="28" rx="14" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <text x="355" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">≥ 4.21.0 and &lt; 5.0.0 — new minors and patches</text>
  <text x="560" y="209" font-size="12" fill="#374151">caret: npm's default; most dependencies</text>

  <!-- tilde -->
  <text x="40" y="256" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="bold" fill="#92400e">~4.21.0</text>
  <rect x="180" y="270" width="160" height="28" rx="14" fill="#fcd34d" stroke="#d97706" stroke-width="2"/>
  <text x="260" y="289" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">&lt; 4.22.0 — patches</text>
  <text x="560" y="289" font-size="12" fill="#374151">tilde: when minor versions are risky</text>

  <!-- exact -->
  <text x="40" y="336" font-family="Menlo, Consolas, monospace" font-size="18" font-weight="bold" fill="#1e40af">4.21.2</text>
  <circle cx="290" cy="364" r="14" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="369" font-size="13" font-weight="bold" fill="#1e3a8a">only this one</text>
  <text x="560" y="369" font-size="12" fill="#374151">exact: you control every upgrade</text>

  <!-- prerelease note -->
  <text x="40" y="410" font-size="12" fill="#5b21b6">6.0.0-beta.1 is never chosen by these ranges — testers install it on purpose (npm install pkg@beta)</text>

  <!-- lockfile -->
  <rect x="24" y="462" width="852" height="62" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="44" y="488" font-size="14" font-weight="bold" fill="#374151">package-lock.json records the EXACT version that was chosen (for example 4.22.1)</text>
  <text x="44" y="510" font-size="13" fill="#374151">npm ci installs exactly that version on every machine — commit the lockfile; upgrades come as tested pull requests</text>
</svg>
