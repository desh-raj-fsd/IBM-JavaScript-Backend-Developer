<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#1f2937">When Does the Customer Give Feedback?</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#6b7280">The same 12-month project in three methodologies (★ = customer sees working software)</text>

  <!-- month axis -->
  <g font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="178" y="96">month 1</text>
    <text x="358" y="96">4</text>
    <text x="598" y="96">8</text>
    <text x="838" y="96">12</text>
  </g>
  <line x1="150" y1="102" x2="870" y2="102" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Waterfall -->
  <text x="24" y="146" font-size="15" font-weight="bold" fill="#1e40af">Waterfall</text>
  <text x="24" y="164" font-size="11" fill="#6b7280">sequential</text>
  <g font-size="11" text-anchor="middle" font-weight="bold">
    <rect x="150" y="124" width="180" height="40" fill="#dbeafe" stroke="#2563eb"/>
    <text x="240" y="149" fill="#1e40af">plan</text>
    <rect x="330" y="124" width="120" height="40" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="390" y="149" fill="#1e40af">design</text>
    <rect x="450" y="124" width="210" height="40" fill="#dcfce7" stroke="#16a34a"/>
    <text x="555" y="149" fill="#166534">code</text>
    <rect x="660" y="124" width="150" height="40" fill="#fef3c7" stroke="#d97706"/>
    <text x="735" y="149" fill="#92400e">test</text>
    <rect x="810" y="124" width="60" height="40" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="840" y="149" fill="#5b21b6">deploy</text>
  </g>
  <text x="690" y="194" font-size="20" fill="#d97706">★</text>
  <text x="712" y="192" font-size="12" fill="#92400e">first feedback ~ month 10</text>

  <!-- V-model -->
  <text x="24" y="246" font-size="15" font-weight="bold" fill="#1e40af">V-shape</text>
  <text x="24" y="264" font-size="11" fill="#6b7280">sequential</text>
  <g font-size="11" text-anchor="middle" font-weight="bold">
    <rect x="150" y="224" width="330" height="40" fill="#dbeafe" stroke="#2563eb"/>
    <text x="315" y="249" fill="#1e40af">plan + design (test plans written here)</text>
    <rect x="480" y="224" width="180" height="40" fill="#dcfce7" stroke="#16a34a"/>
    <text x="570" y="249" fill="#166534">code</text>
    <rect x="660" y="224" width="210" height="40" fill="#fef3c7" stroke="#d97706"/>
    <text x="765" y="249" fill="#92400e">test: unit → acceptance</text>
  </g>
  <text x="790" y="294" font-size="20" fill="#d97706">★</text>
  <text x="640" y="292" font-size="12" fill="#92400e">acceptance ~ month 11</text>

  <!-- Agile -->
  <text x="24" y="346" font-size="15" font-weight="bold" fill="#166534">Agile</text>
  <text x="24" y="364" font-size="11" fill="#6b7280">cyclical</text>
  <g fill="#dcfce7" stroke="#16a34a">
    <rect x="150" y="324" width="56" height="40" rx="4"/>
    <rect x="210" y="324" width="56" height="40" rx="4"/>
    <rect x="270" y="324" width="56" height="40" rx="4"/>
    <rect x="330" y="324" width="56" height="40" rx="4"/>
    <rect x="390" y="324" width="56" height="40" rx="4"/>
    <rect x="450" y="324" width="56" height="40" rx="4"/>
    <rect x="510" y="324" width="56" height="40" rx="4"/>
    <rect x="570" y="324" width="56" height="40" rx="4"/>
    <rect x="630" y="324" width="56" height="40" rx="4"/>
    <rect x="690" y="324" width="56" height="40" rx="4"/>
    <rect x="750" y="324" width="56" height="40" rx="4"/>
    <rect x="810" y="324" width="56" height="40" rx="4"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#166534">
    <text x="178" y="348">S1</text><text x="238" y="348">S2</text><text x="298" y="348">S3</text><text x="358" y="348">S4</text>
    <text x="418" y="348">S5</text><text x="478" y="348">S6</text><text x="538" y="348">S7</text><text x="598" y="348">S8</text>
    <text x="658" y="348">S9</text><text x="718" y="348">S10</text><text x="778" y="348">S11</text><text x="838" y="348">S12</text>
  </g>
  <g font-size="18" fill="#d97706" text-anchor="middle">
    <text x="178" y="392">★</text><text x="238" y="392">★</text><text x="298" y="392">★</text><text x="358" y="392">★</text>
    <text x="418" y="392">★</text><text x="478" y="392">★</text><text x="538" y="392">★</text><text x="598" y="392">★</text>
    <text x="658" y="392">★</text><text x="718" y="392">★</text><text x="778" y="392">★</text><text x="838" y="392">★</text>
  </g>
  <rect x="320" y="404" width="76" height="24" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="358" y="421" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">MVP</text>
  <line x1="358" y1="404" x2="358" y2="396" stroke="#d97706" stroke-width="1.5"/>
  <text x="510" y="421" font-size="12" fill="#166534">feedback at the end of every sprint</text>

  <!-- bottom comparison -->
  <rect x="24" y="450" width="852" height="94" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <g font-size="13" fill="#374151">
    <text x="44" y="476"><tspan font-weight="bold">Sequential</tspan> (Waterfall, V-shape): the whole product is built before the customer gives feedback;</text>
    <text x="44" y="496">easy to plan and budget, but a missed or changed requirement is found late, when it is expensive.</text>
    <text x="44" y="522"><tspan font-weight="bold">Cyclical</tspan> (Agile): quick, short bursts; changes are cheap, but the full scope and budget are harder to fix up front.</text>
  </g>
</svg>
