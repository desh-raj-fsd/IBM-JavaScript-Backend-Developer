<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="540" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">Where the Project Manager’s Work Goes in Scrum</text>
  <text x="450" y="60" text-anchor="middle" font-size="14" fill="#6b7280">Scrum Guide 2020: three accountabilities - no project manager inside the Scrum Team</text>
  <rect x="190" y="80" width="520" height="70" rx="8" fill="#374151"/>
  <text x="450" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Project manager - traditional project</text>
  <text x="450" y="132" text-anchor="middle" font-size="13" fill="#e5e7eb">scope, plan, schedule, budget, people, blockers, communication</text>
  <g stroke="#4b5563" stroke-width="2" fill="none">
    <path d="M450,150 L120,210"/>
    <path d="M450,150 L340,210"/>
    <path d="M450,150 L560,210"/>
    <path d="M450,150 L780,210"/>
  </g>
  <rect x="40" y="210" width="160" height="50" rx="8" fill="#1e40af"/>
  <text x="120" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Product Owner</text>
  <rect x="40" y="270" width="160" height="150" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <text x="120" y="306" text-anchor="middle" font-size="12" fill="#1e3a8a">Scope and priorities</text>
  <text x="120" y="346" text-anchor="middle" font-size="12" fill="#1e3a8a">Orders the backlog</text>
  <text x="120" y="386" text-anchor="middle" font-size="12" fill="#1e3a8a">Product Goal, value</text>
  <rect x="260" y="210" width="160" height="50" rx="8" fill="#047857"/>
  <text x="340" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Developers</text>
  <rect x="260" y="270" width="160" height="150" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="340" y="306" text-anchor="middle" font-size="12" fill="#065f46">Plan the sprint work</text>
  <text x="340" y="346" text-anchor="middle" font-size="12" fill="#065f46">Estimates, forecasts</text>
  <text x="340" y="386" text-anchor="middle" font-size="12" fill="#065f46">How to build it</text>
  <rect x="480" y="210" width="160" height="50" rx="8" fill="#7c3aed"/>
  <text x="560" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Scrum Master</text>
  <rect x="480" y="270" width="160" height="150" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="560" y="306" text-anchor="middle" font-size="12" fill="#4c1d95">Team effectiveness</text>
  <text x="560" y="346" text-anchor="middle" font-size="12" fill="#4c1d95">Removes impediments</text>
  <text x="560" y="386" text-anchor="middle" font-size="12" fill="#4c1d95">Coaches, runs events</text>
  <rect x="700" y="210" width="160" height="50" rx="8" fill="#b45309"/>
  <text x="780" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Sponsor</text>
  <rect x="700" y="270" width="160" height="150" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="780" y="306" text-anchor="middle" font-size="12" fill="#78350f">Budget and contracts</text>
  <text x="780" y="346" text-anchor="middle" font-size="12" fill="#78350f">Reports to managers</text>
  <text x="780" y="386" text-anchor="middle" font-size="12" fill="#78350f">Outside Scrum Team</text>
  <rect x="40" y="440" width="820" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="450" y="464" text-anchor="middle" font-size="14" fill="#1f2937">The Scrum Master is a coach, not a project manager with a new title.</text>
  <text x="450" y="484" text-anchor="middle" font-size="14" fill="#1f2937">Large programs may still have a project manager who works with the Scrum Teams.</text>
  <text x="450" y="522" text-anchor="middle" font-size="12" fill="#6b7280">Communication belongs to the whole Scrum Team; the Scrum Master facilitates it</text>
</svg>
