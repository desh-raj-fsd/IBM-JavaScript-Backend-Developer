<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">Software Engineer vs. Software Developer</text>
  <text x="450" y="72" text-anchor="middle" font-size="15" fill="#6b7280">Engineers build entire systems. Developers implement specific functionality.</text>

  <!-- Engineer side -->
  <rect x="40" y="100" width="400" height="460" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="240" y="136" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e3a8a">Software Engineer</text>
  <text x="240" y="160" text-anchor="middle" font-size="14" fill="#1e3a8a">Big picture • Broad structure</text>

  <!-- system blueprint -->
  <rect x="80" y="180" width="320" height="200" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="240" y="202" text-anchor="middle" font-size="13" fill="#3b82f6">Whole system</text>
  <g font-size="13" text-anchor="middle" fill="#1e3a8a">
    <rect x="100" y="215" width="120" height="44" rx="8" fill="#dbeafe"/><text x="160" y="242">User service</text>
    <rect x="260" y="215" width="120" height="44" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="320" y="242">Booking service</text>
    <rect x="100" y="315" width="120" height="44" rx="8" fill="#dbeafe"/><text x="160" y="342">Database</text>
    <rect x="260" y="315" width="120" height="44" rx="8" fill="#dbeafe"/><text x="320" y="342">Security</text>
  </g>
  <g stroke="#60a5fa" stroke-width="2">
    <line x1="220" y1="237" x2="260" y2="237"/>
    <line x1="160" y1="259" x2="160" y2="315"/>
    <line x1="320" y1="259" x2="320" y2="315"/>
  </g>

  <g font-size="15" fill="#1f2937">
    <text x="70" y="420">• Broader knowledge and scope</text>
    <text x="70" y="448">• Systematic, big-picture thinking</text>
    <text x="70" y="476">• Larger-scale projects</text>
    <text x="70" y="504">• Designs, builds, maintains systems</text>
    <text x="70" y="532">• Consults with stakeholders</text>
  </g>

  <!-- Developer side -->
  <rect x="460" y="100" width="400" height="460" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="660" y="136" text-anchor="middle" font-size="20" font-weight="bold" fill="#78350f">Software Developer</text>
  <text x="660" y="160" text-anchor="middle" font-size="14" fill="#78350f">Specific feature • Immediate problem</text>

  <!-- zoomed code -->
  <rect x="500" y="180" width="320" height="200" rx="10" fill="#1f2937"/>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#e5e7eb">
    <text x="516" y="208" fill="#fbbf24">// Booking service</text>
    <text x="516" y="234">app.post('/bookings',</text>
    <text x="516" y="256">  async (req, res) =&gt; {</text>
    <text x="516" y="278">  validate(req.body);</text>
    <text x="516" y="300">  await Booking.create(</text>
    <text x="516" y="322">    req.body);</text>
    <text x="516" y="344">  res.status(201).send();</text>
    <text x="516" y="366">});</text>
  </g>

  <g font-size="15" fill="#1f2937">
    <text x="490" y="420">• Narrower scope</text>
    <text x="490" y="448">• May use more creative approaches</text>
    <text x="490" y="476">• Writes code for one functionality</text>
    <text x="490" y="504">• Solves an immediate problem</text>
    <text x="490" y="532">• Engineers are also developers</text>
  </g>

  <!-- zoom arrow -->
  <path d="M380 237 C 430 237, 450 220, 500 220" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4"/>
</svg>
