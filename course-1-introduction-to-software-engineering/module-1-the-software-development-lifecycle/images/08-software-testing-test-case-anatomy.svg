<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#1f2937">Anatomy of a Test Case</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#6b7280">Written as soon as the requirement is agreed — before or with the code — and linked to it by ID</text>

  <!-- requirement -->
  <rect x="24" y="92" width="250" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="149" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Requirement REQ-07</text>
  <text x="149" y="142" text-anchor="middle" font-size="12" fill="#1e3a8a">"A reader can rate a book</text>
  <text x="149" y="160" text-anchor="middle" font-size="12" fill="#1e3a8a">with a whole number from 1 to 5"</text>
  <text x="149" y="186" text-anchor="middle" font-size="11" fill="#1e3a8a">the test basis</text>
  <line x1="274" y1="147" x2="316" y2="147" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- test case card -->
  <rect x="320" y="84" width="556" height="330" rx="12" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <rect x="320" y="84" width="556" height="40" rx="12" fill="#374151"/>
  <text x="340" y="110" font-size="15" font-weight="bold" fill="#ffffff">TC-07-02 · Rating above 5 is rejected</text>
  <g font-size="13">
    <text x="340" y="152" font-weight="bold" fill="#374151">Preconditions</text>
    <text x="480" y="152" fill="#374151">user "asha" logged in; the book exists</text>
    <text x="340" y="186" font-weight="bold" fill="#374151">Steps</text>
    <text x="480" y="186" fill="#374151">POST /v1/books/978-0132350884/reviews</text>
    <text x="340" y="220" font-weight="bold" fill="#7c3aed">Input data</text>
    <text x="480" y="220" font-family="Menlo, Consolas, monospace" fill="#5b21b6">{ "rating": 6, "text": "Great" }</text>
    <text x="340" y="254" font-weight="bold" fill="#16a34a">Expected result</text>
    <text x="480" y="254" fill="#166534">400 · "Rating must be between 1 and 5"</text>
    <text x="480" y="274" fill="#166534">· no review saved</text>
    <text x="340" y="308" font-weight="bold" fill="#374151">Actual / status</text>
    <text x="480" y="308" fill="#374151">filled in by the test run: Pass / Fail</text>
    <text x="340" y="342" font-weight="bold" fill="#374151">Priority</text>
    <text x="480" y="342" fill="#374151">High</text>
    <text x="340" y="376" font-weight="bold" fill="#374151">Automated as</text>
    <text x="480" y="376" font-family="Menlo, Consolas, monospace" font-size="12" fill="#374151">test("REQ-07: rating 6 returns 400")</text>
  </g>

  <!-- boundary values -->
  <text x="24" y="452" font-size="15" font-weight="bold" fill="#1f2937">Choosing the input: boundary value analysis for "1 to 5"</text>
  <line x1="60" y1="510" x2="840" y2="510" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="270" y="494" width="380" height="32" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="460" y="550" text-anchor="middle" font-size="12" fill="#166534">valid range</text>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <circle cx="200" cy="510" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="200" y="515" fill="#991b1b">0</text>
    <circle cx="290" cy="510" r="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="290" y="515" fill="#166534">1</text>
    <circle cx="460" cy="510" r="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="460" y="515" fill="#166534">3</text>
    <circle cx="630" cy="510" r="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="630" y="515" fill="#166534">5</text>
    <circle cx="720" cy="510" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="720" y="515" fill="#991b1b">6</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#6b7280">
    <text x="200" y="482">just below</text><text x="290" y="482">lower limit</text><text x="460" y="482">normal</text>
    <text x="630" y="482">upper limit</text><text x="720" y="482">just above</text>
  </g>
  <text x="450" y="580" text-anchor="middle" font-size="12" fill="#374151">plus other equivalence classes: 4.5 (not a whole number), "5" (wrong type) — bugs cluster at the edges</text>
</svg>
