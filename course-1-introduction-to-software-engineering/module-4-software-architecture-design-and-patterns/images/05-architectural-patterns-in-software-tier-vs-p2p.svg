<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="420" fill="#ffffff"/>

  <!-- Header -->
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Architectural Patterns: 2-Tier, 3-Tier (N-Tier), and Peer-to-Peer (P2P)</text>
  <text x="460" y="56" text-anchor="middle" font-size="12.5" fill="#475569">Comparing centralized client-server tiers against decentralized peer nodes sharing workload and resources</text>

  <!-- Panel 1: 2-Tier -->
  <g transform="translate(24, 78)">
    <rect width="276" height="258" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect width="276" height="36" rx="10" fill="#2563eb"/>
    <rect y="22" width="276" height="14" fill="#2563eb"/>
    <text x="138" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1. 2-Tier (Client-Server)</text>

    <rect x="38" y="52" width="200" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="138" y="73" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Multiple Client Machines (UI)</text>

    <line x1="138" y1="86" x2="138" y2="118" stroke="#2563eb" stroke-width="2"/>
    <polygon points="138,122 133,114 143,114" fill="#2563eb"/>
    <polygon points="138,88 133,96 143,96" fill="#2563eb"/>
    <text x="192" y="106" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">Network req</text>

    <rect x="38" y="124" width="200" height="38" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="138" y="147" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Server (Resources &amp; Data)</text>

    <text x="138" y="188" text-anchor="middle" font-size="11" fill="#334155">Clients strictly consume services;</text>
    <text x="138" y="205" text-anchor="middle" font-size="11" fill="#334155">server hosts &amp; manages resources.</text>
    <text x="138" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Ex: DB clients, simple text chat</text>
  </g>

  <!-- Panel 2: 3-Tier / N-Tier -->
  <g transform="translate(322, 78)">
    <rect width="276" height="258" rx="10" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
    <rect width="276" height="36" rx="10" fill="#0d9488"/>
    <rect y="22" width="276" height="14" fill="#0d9488"/>
    <text x="138" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2. 3-Tier (N-Tier Web Apps)</text>

    <rect x="34" y="48" width="208" height="32" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="138" y="68" text-anchor="middle" font-size="11.5" font-weight="700" fill="#134e4a">Presentation Tier (Web Server)</text>

    <line x1="138" y1="80" x2="138" y2="96" stroke="#0d9488" stroke-width="2"/>

    <rect x="34" y="96" width="208" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="138" y="116" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">Application Tier (Logic Server)</text>

    <line x1="138" y1="128" x2="138" y2="144" stroke="#0d9488" stroke-width="2"/>

    <rect x="34" y="144" width="208" height="32" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="138" y="164" text-anchor="middle" font-size="11.5" font-weight="700" fill="#075985">Data Tier (Database Server)</text>

    <text x="138" y="200" text-anchor="middle" font-size="11" fill="#334155">Talks only to adjacent tiers above/below.</text>
    <text x="138" y="217" text-anchor="middle" font-size="11" fill="#334155">Internal changes stay isolated if</text>
    <text x="138" y="233" text-anchor="middle" font-size="11" font-weight="600" fill="#0f766e">API/schema contracts hold stable.</text>
  </g>

  <!-- Panel 3: Peer-to-Peer -->
  <g transform="translate(620, 78)">
    <rect width="276" height="258" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
    <rect width="276" height="36" rx="10" fill="#7c3aed"/>
    <rect y="22" width="276" height="14" fill="#7c3aed"/>
    <text x="138" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3. Peer-to-Peer (P2P)</text>

    <rect x="86" y="48" width="104" height="30" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="138" y="67" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">Peer A (C+S)</text>

    <rect x="22" y="120" width="104" height="30" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="74" y="139" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">Peer B (C+S)</text>

    <rect x="150" y="120" width="104" height="30" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="202" y="139" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">Peer C (C+S)</text>

    <line x1="112" y1="78" x2="78" y2="120" stroke="#7c3aed" stroke-width="1.8"/>
    <line x1="164" y1="78" x2="198" y2="120" stroke="#7c3aed" stroke-width="1.8"/>
    <line x1="126" y1="135" x2="150" y2="135" stroke="#7c3aed" stroke-width="1.8"/>

    <text x="138" y="178" text-anchor="middle" font-size="11" fill="#334155">Nodes act as BOTH client &amp; server,</text>
    <text x="138" y="195" text-anchor="middle" font-size="11" fill="#334155">sharing CPU, disk &amp; bandwidth.</text>
    <text x="138" y="218" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">Ex: Bitcoin, Ethereum, P2P files</text>
    <text x="138" y="235" text-anchor="middle" font-size="10.5" fill="#6d28d9">Cannot combine P2P + 2-tier on node</text>
  </g>

  <!-- Bottom Compatibility Bar -->
  <rect x="24" y="352" width="872" height="48" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="460" y="373" text-anchor="middle" font-size="12.5" font-weight="700" fill="#854d0e">Combining Patterns: Valid Hybrids vs. Mutually Exclusive Roles</text>
  <text x="460" y="391" text-anchor="middle" font-size="11.5" fill="#713f12">Combine 3-tier + microservices or P2P + event-driven; P2P and 2-tier conflict because peers merge client/server roles</text>
</svg>
