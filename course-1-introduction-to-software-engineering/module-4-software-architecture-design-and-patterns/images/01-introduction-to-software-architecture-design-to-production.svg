<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="410" fill="#ffffff"/>

  <!-- Header -->
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">From Architecture Decisions to Production Environment Topology</text>
  <text x="460" y="56" text-anchor="middle" font-size="12.5" fill="#475569">Architectural decisions guide the tech stack, code boundaries, and production infrastructure delivering the app</text>

  <!-- Stage 1 -->
  <g transform="translate(24, 82)">
    <rect width="268" height="242" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect width="268" height="36" rx="10" fill="#2563eb"/>
    <rect y="22" width="268" height="14" fill="#2563eb"/>
    <text x="134" y="23" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Step 1: Qualities &amp; Stack</text>

    <rect x="18" y="54" width="232" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="134" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Target Quality Attributes</text>
    <text x="134" y="88" text-anchor="middle" font-size="11" fill="#1e40af">Speed, scale, uptime, safety</text>

    <rect x="18" y="110" width="232" height="58" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="134" y="130" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">Select Tech Stack:</text>
    <text x="134" y="146" text-anchor="middle" font-size="11" fill="#334155">Language, runtime, libraries,</text>
    <text x="134" y="160" text-anchor="middle" font-size="11" fill="#334155">frameworks, and database</text>

    <text x="134" y="196" text-anchor="middle" font-size="11" fill="#475569">Weigh stack pros, cons,</text>
    <text x="134" y="212" text-anchor="middle" font-size="11" fill="#475569">team skill, and vendor lock-in</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="294" y1="202" x2="322" y2="202" stroke="#475569" stroke-width="2.5"/>
  <polygon points="326,202 317,196 317,208" fill="#475569"/>

  <!-- Stage 2 -->
  <g transform="translate(326, 82)">
    <rect width="268" height="242" rx="10" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
    <rect width="268" height="36" rx="10" fill="#0d9488"/>
    <rect y="22" width="268" height="14" fill="#0d9488"/>
    <text x="134" y="23" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Step 2: System Boundaries</text>

    <rect x="18" y="54" width="232" height="44" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="134" y="72" text-anchor="middle" font-size="11.5" font-weight="700" fill="#134e4a">Components &amp; Interfaces</text>
    <text x="134" y="88" text-anchor="middle" font-size="11" fill="#0f766e">Routes -&gt; Services -&gt; Adapters</text>

    <rect x="18" y="112" width="232" height="56" rx="6" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
    <text x="134" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#134e4a">Modular Isolation:</text>
    <text x="134" y="148" text-anchor="middle" font-size="11" fill="#334155">Swap database or queue vendor</text>
    <text x="134" y="162" text-anchor="middle" font-size="11" fill="#334155">without rewriting core logic</text>

    <text x="134" y="196" text-anchor="middle" font-size="11" fill="#475569">Document boundaries via C4</text>
    <text x="134" y="212" text-anchor="middle" font-size="11" fill="#475569">diagrams + OpenAPI contracts</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="596" y1="202" x2="624" y2="202" stroke="#475569" stroke-width="2.5"/>
  <polygon points="628,202 619,196 619,208" fill="#475569"/>

  <!-- Stage 3 -->
  <g transform="translate(628, 82)">
    <rect width="268" height="242" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
    <rect width="268" height="36" rx="10" fill="#7c3aed"/>
    <rect y="22" width="268" height="14" fill="#7c3aed"/>
    <text x="134" y="23" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Step 3: Production Environment</text>

    <rect x="18" y="52" width="232" height="32" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="134" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">Edge: TLS + Content Delivery</text>

    <rect x="18" y="92" width="232" height="32" rx="5" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="134" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">Load Balancers + Health Checks</text>

    <rect x="18" y="132" width="232" height="32" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="134" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">Stateless App Servers (2+ Nodes)</text>

    <rect x="18" y="172" width="232" height="32" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="134" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#075985">Databases, Backups &amp; Logs</text>

    <text x="134" y="224" text-anchor="middle" font-size="11" fill="#475569">Delivers live app to end-users</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="24" y="344" width="872" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="460" y="365" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Production Baseline: Infrastructure Mirrors Architectural Guarantees</text>
  <text x="460" y="383" text-anchor="middle" font-size="11.5" fill="#166534">Lecture covers servers, load balancers, and databases; modern systems add TLS, observability, and staging parity</text>
</svg>
