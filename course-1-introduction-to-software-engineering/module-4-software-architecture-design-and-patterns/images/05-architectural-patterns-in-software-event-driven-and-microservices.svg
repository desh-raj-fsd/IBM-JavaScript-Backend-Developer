<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="420" fill="#ffffff"/>

  <!-- Header -->
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Event-Driven Architecture vs. Microservices (API Gateway &amp; Routing)</text>
  <text x="460" y="56" text-anchor="middle" font-size="12.5" fill="#475569">Loosely coupled distributed patterns decouple reactions via events or isolate business capabilities behind an API Gateway</text>

  <!-- Left Panel: Event-Driven -->
  <g transform="translate(24, 78)">
    <rect width="426" height="260" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect width="426" height="36" rx="10" fill="#2563eb"/>
    <rect y="22" width="426" height="14" fill="#2563eb"/>
    <text x="213" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Event-Driven Pattern (Uber / Lyft Flow)</text>

    <rect x="20" y="54" width="120" height="52" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="80" y="75" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Producer</text>
    <text x="80" y="92" text-anchor="middle" font-size="10.5" fill="#1e40af">Rider Request</text>

    <line x1="140" y1="80" x2="176" y2="80" stroke="#2563eb" stroke-width="2"/>
    <polygon points="180,80 172,76 172,84" fill="#2563eb"/>

    <rect x="180" y="54" width="106" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="233" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Event Router</text>
    <text x="233" y="92" text-anchor="middle" font-size="10.5" fill="#78350f">Notification</text>

    <line x1="286" y1="70" x2="318" y2="58" stroke="#16a34a" stroke-width="2"/>
    <line x1="286" y1="90" x2="318" y2="104" stroke="#16a34a" stroke-width="2"/>

    <rect x="320" y="44" width="90" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="365" y="65" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">DriverMatch</text>

    <rect x="320" y="88" width="90" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="365" y="109" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">PricingCalc</text>

    <text x="213" y="150" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">Loosely coupled producers and consumers</text>
    <rect x="20" y="168" width="386" height="76" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="213" y="189" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Modern Broker Reality (Martin Fowler docs):</text>
    <text x="213" y="207" text-anchor="middle" font-size="11" fill="#1e40af">Routers can push (webhooks) OR let consumers pull</text>
    <text x="213" y="223" text-anchor="middle" font-size="11" fill="#1e40af">at their own pace (queues/Kafka) with AsyncAPI</text>
  </g>

  <!-- Right Panel: Microservices -->
  <g transform="translate(470, 78)">
    <rect width="426" height="260" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
    <rect width="426" height="36" rx="10" fill="#7c3aed"/>
    <rect y="22" width="426" height="14" fill="#7c3aed"/>
    <text x="213" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Microservices Pattern (Social Media App)</text>

    <rect x="20" y="54" width="90" height="52" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="65" y="77" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">Account</text>
    <text x="65" y="93" text-anchor="middle" font-size="10.5" fill="#5b21b6">Client</text>

    <line x1="110" y1="80" x2="142" y2="80" stroke="#7c3aed" stroke-width="2"/>
    <polygon points="146,80 138,76 138,84" fill="#7c3aed"/>

    <rect x="146" y="54" width="110" height="52" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="201" y="76" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">API Gateway</text>
    <text x="201" y="93" text-anchor="middle" font-size="10.5" fill="#5b21b6">Routes + Auth</text>

    <line x1="256" y1="66" x2="294" y2="54" stroke="#7c3aed" stroke-width="2"/>
    <line x1="256" y1="80" x2="294" y2="82" stroke="#7c3aed" stroke-width="2"/>
    <line x1="256" y1="94" x2="294" y2="112" stroke="#7c3aed" stroke-width="2"/>

    <rect x="296" y="40" width="114" height="26" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="353" y="57" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4c1d95">Add Friends</text>

    <rect x="296" y="70" width="114" height="26" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="353" y="87" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4c1d95">Ad Targeting</text>

    <rect x="296" y="100" width="114" height="26" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="353" y="117" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4c1d95">Content Feed</text>

    <text x="213" y="150" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">Orchestration vs. Choreography</text>
    <rect x="20" y="168" width="386" height="76" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="213" y="189" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">Smart Endpoints &amp; Dumb Pipes (Martin Fowler):</text>
    <text x="213" y="207" text-anchor="middle" font-size="11" fill="#5b21b6">Avoid bloating the API Gateway with business logic;</text>
    <text x="213" y="223" text-anchor="middle" font-size="11" fill="#5b21b6">prefer event choreography or explicit Saga workflows</text>
  </g>

  <!-- Bottom Guidance Bar -->
  <rect x="24" y="354" width="872" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="460" y="375" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Architecture Selection Rule (per Design §4.2)</text>
  <text x="460" y="393" text-anchor="middle" font-size="11.5" fill="#166534">Start with a 3-tier modular monolith + event queues for slow tasks; extract microservices only when justified by an ADR</text>
</svg>
