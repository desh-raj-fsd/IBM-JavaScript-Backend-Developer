<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="420" fill="#ffffff"/>

  <!-- Header -->
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Distributed Systems &amp; Service-Oriented Architecture (SOA)</text>
  <text x="460" y="56" text-anchor="middle" font-size="12.5" fill="#475569">Services across multiple network nodes pass messages (HTTP) yet appear to users as one coherent system</text>

  <!-- Left Side: Distributed Topology Diagram -->
  <g transform="translate(24, 78)">
    <rect width="530" height="262" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect width="530" height="36" rx="10" fill="#2563eb"/>
    <rect y="22" width="530" height="14" fill="#2563eb"/>
    <text x="265" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Multi-Node Distributed Topology</text>

    <!-- User / Gateway -->
    <rect x="165" y="48" width="200" height="36" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <text x="265" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">End-User -&gt; Single Coherent Portal</text>

    <!-- Arrows down to 3 nodes -->
    <line x1="210" y1="84" x2="90" y2="122" stroke="#0d9488" stroke-width="2"/>
    <line x1="265" y1="84" x2="265" y2="122" stroke="#0d9488" stroke-width="2"/>
    <line x1="320" y1="84" x2="440" y2="122" stroke="#0d9488" stroke-width="2"/>
    <text x="128" y="106" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f766e">HTTP</text>
    <text x="400" y="106" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f766e">HTTP</text>

    <!-- Node 1 -->
    <rect x="18" y="124" width="150" height="74" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="93" y="144" text-anchor="middle" font-size="11.5" font-weight="700" fill="#134e4a">Node 1 (Linux)</text>
    <text x="93" y="162" text-anchor="middle" font-size="11" fill="#0f766e">Credit Service</text>
    <text x="93" y="180" text-anchor="middle" font-size="10.5" fill="#115e59">Node.js (replicas x2)</text>

    <!-- Node 2 -->
    <rect x="190" y="124" width="150" height="74" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="265" y="144" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">Node 2 (Cloud VM)</text>
    <text x="265" y="162" text-anchor="middle" font-size="11" fill="#166534">Loan Calc Service</text>
    <text x="265" y="180" text-anchor="middle" font-size="10.5" fill="#15803d">Python / FastAPI</text>

    <!-- Node 3 -->
    <rect x="362" y="124" width="150" height="74" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="437" y="144" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">Node 3 (Cluster)</text>
    <text x="437" y="162" text-anchor="middle" font-size="11" fill="#5b21b6">Shared Database</text>
    <text x="437" y="180" text-anchor="middle" font-size="10.5" fill="#6d28d9">PostgreSQL + Backups</text>

    <text x="265" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Heterogeneous hardware, operating systems, and languages</text>
    <text x="265" y="240" text-anchor="middle" font-size="11" fill="#475569">Architecture styles: client-server, three-tier, peer-to-peer, microservices</text>
  </g>

  <!-- Right Side: Distributed System Properties -->
  <g transform="translate(574, 78)">
    <rect width="322" height="262" rx="10" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
    <rect width="322" height="36" rx="10" fill="#0d9488"/>
    <rect y="22" width="322" height="14" fill="#0d9488"/>
    <text x="161" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Key Distributed Properties</text>

    <rect x="18" y="50" width="286" height="122" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="161" y="71" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">Strengths Highlighted in Lecture:</text>
    <text x="161" y="90" text-anchor="middle" font-size="11" fill="#166534">Shared hardware, software &amp; data</text>
    <text x="161" y="108" text-anchor="middle" font-size="11" fill="#166534">Concurrent work: lower latency,</text>
    <text x="161" y="124" text-anchor="middle" font-size="11" fill="#166534">higher throughput &amp; scalability</text>
    <text x="161" y="144" text-anchor="middle" font-size="11" fill="#166534">Fault tolerance + live rolling updates</text>

    <rect x="18" y="184" width="286" height="62" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="161" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">Reality Check:</text>
    <text x="161" y="221" text-anchor="middle" font-size="11" fill="#1e40af">Fault tolerance requires timeouts,</text>
    <text x="161" y="236" text-anchor="middle" font-size="11" fill="#1e40af">retries, health checks &amp; circuit breakers</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="24" y="356" width="872" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="460" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Backend Design Rule: Only distribute services over the network when scaling or team ownership demands it</text>
</svg>
