<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="430" fill="#ffffff"/>

  <!-- Header -->
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Behavioral Models: State Transition vs. Sequence Interaction</text>
  <text x="460" y="56" text-anchor="middle" font-size="12.5" fill="#475569">Behavioral UML diagrams describe WHAT the system does over states and time without exposing internal code</text>

  <!-- Left Panel: State Transition -->
  <g transform="translate(24, 78)">
    <rect width="426" height="270" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect width="426" height="36" rx="10" fill="#2563eb"/>
    <rect y="22" width="426" height="14" fill="#2563eb"/>
    <text x="213" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1. State Transition (Clinic Patient Flow)</text>

    <!-- State nodes -->
    <rect x="34" y="64" width="110" height="38" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
    <text x="89" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">waiting</text>

    <line x1="144" y1="83" x2="254" y2="83" stroke="#16a34a" stroke-width="2"/>
    <polygon points="258,83 249,78 249,88" fill="#16a34a"/>
    <text x="200" y="75" text-anchor="middle" font-size="10.5" font-weight="700" fill="#16a34a">START_TEST</text>

    <rect x="258" y="64" width="116" height="38" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="316" y="88" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">testing</text>

    <line x1="316" y1="102" x2="316" y2="144" stroke="#16a34a" stroke-width="2"/>
    <polygon points="316,148 311,139 321,139" fill="#16a34a"/>
    <text x="366" y="130" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">RESULTS_READY</text>

    <rect x="234" y="150" width="164" height="38" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="316" y="174" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">with the doctor</text>

    <!-- Direct skip path -->
    <path d="M 89 102 L 89 169 L 230 169" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5,3"/>
    <polygon points="234,169 225,164 225,174" fill="#64748b"/>
    <text x="155" y="160" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">CALL_IN</text>

    <rect x="20" y="204" width="386" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="213" y="224" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Captures valid states + triggering events</text>
    <text x="213" y="241" text-anchor="middle" font-size="11" fill="#1e40af">Turns directly into Map state tables &amp; QA edge-case tests</text>
  </g>

  <!-- Right Panel: Sequence Interaction -->
  <g transform="translate(470, 78)">
    <rect width="426" height="270" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
    <rect width="426" height="36" rx="10" fill="#7c3aed"/>
    <rect y="22" width="426" height="14" fill="#7c3aed"/>
    <text x="213" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2. Sequence Diagram (Online Appointment)</text>

    <!-- Participants -->
    <rect x="26" y="50" width="96" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="74" y="68" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">Patient</text>

    <rect x="165" y="50" width="96" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="213" y="68" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">Portal UI</text>

    <rect x="304" y="50" width="96" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="352" y="68" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">Clinic API</text>

    <!-- Lifelines -->
    <line x1="74" y1="78" x2="74" y2="192" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="213" y1="78" x2="213" y2="192" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="352" y1="78" x2="352" y2="192" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Messages over time -->
    <line x1="74" y1="104" x2="209" y2="104" stroke="#2563eb" stroke-width="2"/>
    <polygon points="213,104 205,100 205,108" fill="#2563eb"/>
    <text x="143" y="98" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e3a8a">1. selectSlot()</text>

    <line x1="213" y1="134" x2="348" y2="134" stroke="#0d9488" stroke-width="2"/>
    <polygon points="352,134 344,130 344,138" fill="#0d9488"/>
    <text x="282" y="128" text-anchor="middle" font-size="10.5" font-weight="600" fill="#134e4a">2. bookAppt()</text>

    <line x1="352" y1="164" x2="217" y2="164" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,2"/>
    <polygon points="213,164 221,160 221,168" fill="#7c3aed"/>
    <text x="282" y="158" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4c1d95">3. 201 Created</text>

    <line x1="213" y1="184" x2="78" y2="184" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,2"/>
    <polygon points="74,184 82,180 82,188" fill="#7c3aed"/>
    <text x="143" y="178" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4c1d95">4. showConfirmed</text>

    <rect x="20" y="204" width="386" height="52" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="213" y="224" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">Shows object communication across time</text>
    <text x="213" y="241" text-anchor="middle" font-size="11" fill="#5b21b6">Great for API handshakes, retries, and auth flows</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="24" y="364" width="872" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="460" y="385" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Diagrams as Code Today: Mermaid in Git Pull Requests</text>
  <text x="460" y="403" text-anchor="middle" font-size="11.5" fill="#166534">Teams keep Sequence &amp; State diagrams plus C4 maps as text in Git instead of maintaining all formal UML diagram files</text>
</svg>
