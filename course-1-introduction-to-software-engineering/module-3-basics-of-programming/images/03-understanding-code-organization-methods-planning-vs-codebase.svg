<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="450" fill="#ffffff"/>
<text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Algorithm Planning vs. Real Codebase Organization</text>
<text x="450" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Correction: flowcharts and pseudocode plan small algorithms; real apps organize modules by layer</text>

<!-- Left: Planning one algorithm -->
<rect x="45" y="92" width="380" height="295" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="45" y="92" width="380" height="44" rx="14" fill="#dbeafe"/>
<text x="235" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">1. Planning One Function or Flow</text>

<rect x="65" y="154" width="340" height="62" rx="8" fill="#ffffff" stroke="#93c5fd"/>
<text x="235" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">Flowcharts / Mermaid Diagrams</text>
<text x="235" y="198" text-anchor="middle" font-size="11" fill="#1e40af">Visual branches for small, tricky flows</text>

<rect x="65" y="232" width="340" height="62" rx="8" fill="#ffffff" stroke="#93c5fd"/>
<text x="235" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">Pseudocode / Gherkin Specs</text>
<text x="235" y="276" text-anchor="middle" font-size="11" fill="#1e40af">Syntax-free steps to align team logic</text>

<rect x="65" y="310" width="340" height="58" rx="8" fill="#ffffff" stroke="#93c5fd"/>
<text x="235" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">TDD Unit Tests</text>
<text x="235" y="353" text-anchor="middle" font-size="11" fill="#1e40af">Executable specs checking edge cases</text>

<!-- Arrow -->
<line x1="425" y1="240" x2="468" y2="240" stroke="#475569" stroke-width="2.5"/>
<polygon points="474,240 463,234 463,246" fill="#475569"/>

<!-- Right: Organizing the codebase -->
<rect x="475" y="92" width="380" height="295" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<rect x="475" y="92" width="380" height="44" rx="14" fill="#ccfbf1"/>
<text x="665" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#115e59">2. Organizing a Real Back-End Codebase</text>

<rect x="495" y="154" width="340" height="62" rx="8" fill="#ffffff" stroke="#5eead4"/>
<text x="665" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#115e59">Routes Layer (src/routes/)</text>
<text x="665" y="198" text-anchor="middle" font-size="11" fill="#134e4a">Parses HTTP requests and validates inputs</text>

<rect x="495" y="232" width="340" height="62" rx="8" fill="#ffffff" stroke="#5eead4"/>
<text x="665" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#115e59">Services Layer (src/services/)</text>
<text x="665" y="276" text-anchor="middle" font-size="11" fill="#134e4a">Small functions holding business rules</text>

<rect x="495" y="310" width="340" height="58" rx="8" fill="#ffffff" stroke="#5eead4"/>
<text x="665" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#115e59">Repositories Layer (src/repositories/)</text>
<text x="665" y="353" text-anchor="middle" font-size="11" fill="#134e4a">Parameterized SQL / database queries only</text>

<text x="450" y="424" text-anchor="middle" font-size="13" fill="#374151">Good practice: plan logic in plain words or Mermaid, then separate HTTP, business rules, and SQL.</text>
</svg>
