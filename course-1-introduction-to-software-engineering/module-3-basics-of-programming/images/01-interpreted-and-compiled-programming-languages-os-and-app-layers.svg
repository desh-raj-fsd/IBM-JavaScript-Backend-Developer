<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="460" fill="#ffffff"/>
<text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">How Operating Systems and Apps Mix Languages</text>
<text x="450" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Correction: Android is not purely Java, and compiled apps ship with shared libraries</text>

<!-- Android Stack (Left) -->
<rect x="45" y="95" width="390" height="305" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="240" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Android OS &amp; App Stack</text>

<rect x="70" y="142" width="340" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="240" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Apps: Kotlin-first (or Java)</text>
<text x="240" y="188" text-anchor="middle" font-size="12" fill="#1e40af">Compiled to DEX bytecode for ART</text>

<rect x="70" y="226" width="340" height="68" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="240" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#115e59">Android Runtime (ART) + Native Libs</text>
<text x="240" y="272" text-anchor="middle" font-size="12" fill="#134e4a">Built in C, C++, and Rust (.so libraries)</text>

<rect x="70" y="310" width="340" height="68" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="240" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">OS Core: Linux Kernel</text>
<text x="240" y="356" text-anchor="middle" font-size="12" fill="#7c2d12">Written in C and Rust; drives hardware</text>

<!-- Desktop OS & App Bundle (Right) -->
<rect x="465" y="95" width="390" height="305" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="660" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Desktop OS &amp; Compiled App Package</text>

<rect x="490" y="142" width="340" height="68" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="660" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">App Executable + Shared Libraries</text>
<text x="660" y="188" text-anchor="middle" font-size="12" fill="#15803d">Main binary + .dll / .dylib / .so + assets</text>

<rect x="490" y="226" width="340" height="68" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
<text x="660" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">Managed Runtimes (Optional)</text>
<text x="660" y="272" text-anchor="middle" font-size="12" fill="#713f12">JVM (Java) or .NET CLR (C# CIL)</text>

<rect x="490" y="310" width="340" height="68" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="660" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">Windows / macOS / Linux Kernels</text>
<text x="660" y="356" text-anchor="middle" font-size="11" fill="#7c2d12">Compiled C, C++ (plus Rust in Linux / Windows)</text>

<text x="450" y="438" text-anchor="middle" font-size="13" fill="#374151">Large apps and OS updates ship many compiled executables, shared libraries, and runtime files.</text>
</svg>
