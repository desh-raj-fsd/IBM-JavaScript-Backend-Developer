<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="420" fill="#ffffff"/>

  <!-- Header -->
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Branching Constructs: Structured Paths vs. Legacy GoTo</text>
  <text x="460" y="56" text-anchor="middle" font-size="12.5" fill="#475569">Programs evaluate Boolean conditions (true / false) to choose which instructions execute</text>

  <!-- Card 1: if -->
  <g transform="translate(24, 80)">
    <rect width="206" height="254" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect width="206" height="36" rx="10" fill="#2563eb"/>
    <rect y="22" width="206" height="14" fill="#2563eb"/>
    <text x="103" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1. if (Single Branch)</text>

    <rect x="33" y="54" width="140" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="103" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Condition true?</text>

    <line x1="68" y1="88" x2="54" y2="120" stroke="#16a34a" stroke-width="2"/>
    <text x="46" y="108" text-anchor="middle" font-size="10.5" font-weight="700" fill="#16a34a">true</text>
    <rect x="14" y="122" width="84" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="56" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Run block</text>

    <line x1="138" y1="88" x2="152" y2="120" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="162" y="108" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">false</text>
    <rect x="112" y="122" width="80" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="152" y="144" text-anchor="middle" font-size="11" fill="#475569">Skip block</text>

    <text x="103" y="190" text-anchor="middle" font-size="11" fill="#334155">Runs body only when</text>
    <text x="103" y="206" text-anchor="middle" font-size="11" fill="#334155">condition is true.</text>
    <text x="103" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">Great for guard clauses</text>
  </g>

  <!-- Card 2: if / else -->
  <g transform="translate(246, 80)">
    <rect width="206" height="254" rx="10" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
    <rect width="206" height="36" rx="10" fill="#0d9488"/>
    <rect y="22" width="206" height="14" fill="#0d9488"/>
    <text x="103" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2. if-else (Two-Way)</text>

    <rect x="33" y="54" width="140" height="34" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="103" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#134e4a">Condition true?</text>

    <line x1="68" y1="88" x2="54" y2="120" stroke="#16a34a" stroke-width="2"/>
    <text x="46" y="108" text-anchor="middle" font-size="10.5" font-weight="700" fill="#16a34a">true</text>
    <rect x="14" y="122" width="84" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="56" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">True branch</text>

    <line x1="138" y1="88" x2="152" y2="120" stroke="#ea580c" stroke-width="2"/>
    <text x="162" y="108" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ea580c">false</text>
    <rect x="108" y="122" width="84" height="36" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="150" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">Else branch</text>

    <text x="103" y="190" text-anchor="middle" font-size="11" fill="#334155">Always executes one of</text>
    <text x="103" y="206" text-anchor="middle" font-size="11" fill="#334155">the two branches.</text>
    <text x="103" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#0f766e">No "then" keyword in JS</text>
  </g>

  <!-- Card 3: switch -->
  <g transform="translate(468, 80)">
    <rect width="206" height="254" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
    <rect width="206" height="36" rx="10" fill="#7c3aed"/>
    <rect y="22" width="206" height="14" fill="#7c3aed"/>
    <text x="103" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3. switch (Multi-Way)</text>

    <rect x="16" y="52" width="174" height="30" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="103" y="71" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4c1d95">Match value via ===</text>

    <rect x="16" y="92" width="174" height="28" rx="5" fill="#ffffff" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="103" y="110" text-anchor="middle" font-size="11" fill="#334155">case "a": ... break;</text>

    <rect x="16" y="126" width="174" height="28" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="103" y="144" text-anchor="middle" font-size="11" fill="#92400e">No break = falls through!</text>

    <text x="103" y="182" text-anchor="middle" font-size="11" fill="#334155">Maps one value across</text>
    <text x="103" y="198" text-anchor="middle" font-size="11" fill="#334155">multiple case paths.</text>
    <text x="103" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">Modern JS: prefer lookup</text>
    <text x="103" y="237" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">objects or Map</text>
  </g>

  <!-- Card 4: Legacy GoTo -->
  <g transform="translate(690, 80)">
    <rect width="206" height="254" rx="10" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
    <rect width="206" height="36" rx="10" fill="#dc2626"/>
    <rect y="22" width="206" height="14" fill="#dc2626"/>
    <text x="103" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4. GoTo (Avoid / Legacy)</text>

    <rect x="16" y="54" width="174" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="103" y="75" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">One-way line jump</text>

    <path d="M 46 92 C 155 104, 50 132, 160 144" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3"/>
    <path d="M 160 92 C 55 104, 155 132, 46 144" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="103" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Spaghetti code risk</text>

    <text x="103" y="190" text-anchor="middle" font-size="11" fill="#475569">Unused in JS, Python,</text>
    <text x="103" y="206" text-anchor="middle" font-size="11" fill="#475569">and Java control flow.</text>
    <text x="103" y="226" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Replace with return,</text>
    <text x="103" y="241" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">break, and functions</text>
  </g>

  <!-- Bottom Best Practice Bar -->
  <rect x="24" y="352" width="872" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="460" y="373" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Modern Backend Standard: Guard Clauses + Strict Equality (===)</text>
  <text x="460" y="391" text-anchor="middle" font-size="11.5" fill="#1e40af">Reject bad inputs early with return/throw instead of deep nested if-else pyramids or loose == checks</text>
</svg>
