<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="440" fill="#ffffff"/>

  <!-- Header -->
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Loop Control Flow: Entry-Controlled vs. Exit-Controlled</text>
  <text x="460" y="56" text-anchor="middle" font-size="12.5" fill="#475569">Iteration repeats instructions until the condition is false, then falls through to the next statement</text>

  <!-- Panel 1: while -->
  <g transform="translate(24, 78)">
    <rect width="276" height="278" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/>
    <rect width="276" height="36" rx="10" fill="#2563eb"/>
    <rect y="22" width="276" height="14" fill="#2563eb"/>
    <text x="138" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">while (Entry-Controlled)</text>

    <rect x="33" y="54" width="210" height="36" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="138" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">1. Test condition FIRST</text>

    <line x1="138" y1="90" x2="138" y2="118" stroke="#16a34a" stroke-width="2"/>
    <text x="160" y="108" font-size="11" font-weight="700" fill="#16a34a">true</text>

    <rect x="33" y="120" width="210" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="138" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">2. Run loop body</text>

    <!-- Loop back arrow -->
    <path d="M 33 138 L 14 138 L 14 72 L 31 72" fill="none" stroke="#2563eb" stroke-width="2"/>
    <polygon points="33,72 25,67 25,77" fill="#2563eb"/>

    <!-- False exit -->
    <line x1="243" y1="72" x2="262" y2="72" stroke="#64748b" stroke-width="2"/>
    <line x1="262" y1="72" x2="262" y2="188" stroke="#64748b" stroke-width="2"/>
    <line x1="262" y1="188" x2="195" y2="188" stroke="#64748b" stroke-width="2"/>
    <rect x="78" y="172" width="120" height="30" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="138" y="191" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">false: Exit loop</text>

    <text x="138" y="226" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">Runs 0 or more times</text>
    <text x="138" y="244" text-anchor="middle" font-size="11" fill="#475569">Use when total iterations</text>
    <text x="138" y="260" text-anchor="middle" font-size="11" fill="#475569">are unknown ahead of time</text>
  </g>

  <!-- Panel 2: for -->
  <g transform="translate(322, 78)">
    <rect width="276" height="278" rx="10" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
    <rect width="276" height="36" rx="10" fill="#0d9488"/>
    <rect y="22" width="276" height="14" fill="#0d9488"/>
    <text x="138" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">for (Entry-Controlled!)</text>

    <rect x="33" y="46" width="210" height="26" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="138" y="63" text-anchor="middle" font-size="11.5" font-weight="600" fill="#134e4a">1. Init counter (once)</text>

    <line x1="138" y1="72" x2="138" y2="82" stroke="#0d9488" stroke-width="2"/>

    <rect x="33" y="82" width="210" height="28" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="138" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">2. Test before body</text>

    <line x1="138" y1="110" x2="138" y2="126" stroke="#16a34a" stroke-width="2"/>
    <text x="148" y="122" font-size="10.5" font-weight="700" fill="#16a34a">true</text>
    <rect x="33" y="126" width="210" height="26" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="138" y="143" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14532d">3. Run loop body</text>

    <line x1="138" y1="152" x2="138" y2="164" stroke="#0d9488" stroke-width="2"/>
    <rect x="33" y="164" width="210" height="26" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="138" y="181" text-anchor="middle" font-size="11.5" font-weight="600" fill="#075985">4. Update counter</text>

    <!-- Loop back (4 -> 2) -->
    <path d="M 33 177 L 14 177 L 14 96 L 31 96" fill="none" stroke="#0d9488" stroke-width="2"/>
    <polygon points="33,96 25,91 25,101" fill="#0d9488"/>

    <!-- False exit (2 -> Exit) -->
    <path d="M 243 96 L 260 96 L 260 212 L 200 212" fill="none" stroke="#64748b" stroke-width="2"/>
    <polygon points="198,212 206,207 206,217" fill="#64748b"/>
    <text x="252" y="90" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">false</text>
    <rect x="78" y="198" width="120" height="28" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="138" y="216" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">false: Exit loop</text>

    <text x="138" y="244" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">Runs 0 or more times</text>
    <text x="138" y="262" text-anchor="middle" font-size="11" fill="#475569">Modern JS: for...of / .map()</text>
  </g>

  <!-- Panel 3: do-while -->
  <g transform="translate(620, 78)">
    <rect width="276" height="278" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
    <rect width="276" height="36" rx="10" fill="#7c3aed"/>
    <rect y="22" width="276" height="14" fill="#7c3aed"/>
    <text x="138" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">do-while (Exit-Controlled)</text>

    <rect x="33" y="54" width="210" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="138" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">1. Run body FIRST</text>

    <line x1="138" y1="90" x2="138" y2="118" stroke="#7c3aed" stroke-width="2"/>

    <rect x="33" y="120" width="210" height="36" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="138" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">2. Test condition AFTER</text>

    <!-- Loop back on true -->
    <path d="M 33 138 L 14 138 L 14 72 L 31 72" fill="none" stroke="#16a34a" stroke-width="2"/>
    <polygon points="33,72 25,67 25,77" fill="#16a34a"/>
    <rect x="2" y="96" width="26" height="16" rx="3" fill="#f8fafc"/>
    <text x="15" y="108" text-anchor="middle" font-size="10.5" font-weight="700" fill="#16a34a">true</text>

    <!-- False exit -->
    <line x1="138" y1="156" x2="138" y2="174" stroke="#64748b" stroke-width="2"/>
    <rect x="78" y="174" width="120" height="30" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="138" y="193" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">false: Exit loop</text>

    <text x="138" y="226" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5b21b6">Always runs &gt;= 1 time</text>
    <text x="138" y="244" text-anchor="middle" font-size="11" fill="#475569">Absent in Python (uses</text>
    <text x="138" y="260" text-anchor="middle" font-size="11" fill="#475569">while True + break)</text>
  </g>

  <!-- Bottom Best Practice Bar -->
  <rect x="24" y="372" width="872" height="48" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="460" y="393" text-anchor="middle" font-size="12.5" font-weight="700" fill="#854d0e">Node.js Backend Warning: Never Block the Single-Threaded Event Loop</text>
  <text x="460" y="411" text-anchor="middle" font-size="11.5" fill="#713f12">Huge synchronous loops freeze all requests — use bounded batches, streaming, or worker threads</text>
</svg>
