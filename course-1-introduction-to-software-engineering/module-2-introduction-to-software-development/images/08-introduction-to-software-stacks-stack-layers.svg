<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="520" fill="#ffffff"/>
<text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">A Software Stack Is a Set of Layers</text>
<text x="450" y="66" text-anchor="middle" font-size="14" fill="#6b7280">Higher layers serve the user. Lower layers work with the hardware.</text>
<rect x="30" y="90" width="560" height="64" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="50" y="118" font-size="15" font-weight="bold" fill="#115e59">Presentation layer (front end)</text>
<text x="50" y="140" font-size="12" fill="#134e4a">HTML, CSS, JavaScript, a framework or library, UI tools</text>
<rect x="30" y="164" width="560" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="50" y="192" font-size="15" font-weight="bold" fill="#1e3a8a">Business logic layer (back end)</text>
<text x="50" y="214" font-size="12" fill="#1e3a8a">Language, framework, web server, app server, messaging</text>
<rect x="30" y="238" width="560" height="64" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="50" y="266" font-size="15" font-weight="bold" fill="#9a3412">Data layer</text>
<text x="50" y="288" font-size="12" fill="#7c2d12">Relational or document database, files, cache</text>
<rect x="30" y="312" width="560" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="50" y="340" font-size="15" font-weight="bold" fill="#5b21b6">Runtime, operating system, security, networking</text>
<text x="50" y="362" font-size="12" fill="#4c1d95">Node.js, Linux, TLS, virtualization, orchestration</text>
<rect x="30" y="386" width="560" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="50" y="414" font-size="15" font-weight="bold" fill="#991b1b">Hardware and infrastructure</text>
<text x="50" y="436" font-size="12" fill="#7f1d1d">Virtual machines, containers, storage, load balancers</text>
<rect x="620" y="90" width="250" height="286" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="745" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Software stack</text>
<text x="745" y="142" text-anchor="middle" font-size="11" fill="#475569">the layers on the left, down to the runtime</text>
<rect x="620" y="386" width="250" height="64" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="745" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Plus infrastructure</text>
<text x="745" y="434" text-anchor="middle" font-size="11" fill="#475569">= technology stack (wider term)</text>
<text x="745" y="190" text-anchor="middle" font-size="12" fill="#334155">You may use only the</text>
<text x="745" y="208" text-anchor="middle" font-size="12" fill="#334155">layers that are relevant.</text>
<text x="745" y="248" text-anchor="middle" font-size="12" fill="#334155">There is no formal</text>
<text x="745" y="266" text-anchor="middle" font-size="12" fill="#334155">definition of a stack.</text>
<text x="450" y="495" text-anchor="middle" font-size="13" fill="#374151">Record the choices in an ADR with alternatives and an exit plan.</text>
</svg>
