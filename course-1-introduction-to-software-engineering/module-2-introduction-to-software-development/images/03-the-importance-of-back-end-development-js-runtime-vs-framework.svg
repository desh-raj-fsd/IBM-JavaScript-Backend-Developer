<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="460" fill="#ffffff"/>
<text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">JavaScript Runtime vs. Back-End Framework</text>
<text x="450" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Correction: Node.js is the runtime environment that executes JS; Express is the web framework on top of it</text>

<!-- JS Stack (Left) -->
<rect x="45" y="95" width="490" height="310" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="290" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">JavaScript / TypeScript Back-End Stack</text>

<!-- App Code -->
<rect x="70" y="140" width="440" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="290" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Your Application Code</text>
<text x="290" y="187" text-anchor="middle" font-size="12" fill="#1e40af">Routes, auth, validation, business rules, SQL / ORM</text>

<!-- Framework Layer -->
<rect x="70" y="218" width="440" height="74" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="290" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#115e59">Web Framework Layer (Routing + Middleware)</text>
<text x="290" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f766e">Express 5  |  Fastify  |  NestJS  |  Hono</text>
<text x="290" y="284" text-anchor="middle" font-size="11" fill="#134e4a">Maps HTTP method + path to handlers; structures errors</text>

<!-- Runtime Layer -->
<rect x="70" y="308" width="440" height="80" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="290" y="334" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">Runtime Environment Layer (NOT a framework)</text>
<text x="290" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">Node.js (v26 Active LTS / v24 &amp; v22)  |  Deno  |  Bun</text>
<text x="290" y="376" text-anchor="middle" font-size="11" fill="#7c2d12">Runs JS outside browser; adds HTTP, file, and OS APIs</text>

<!-- Python Stack (Right) -->
<rect x="565" y="95" width="290" height="310" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="710" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Python Back-End Stack</text>

<rect x="590" y="140" width="240" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="710" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Your Application Code</text>
<text x="710" y="187" text-anchor="middle" font-size="12" fill="#1e40af">Views, APIs, ORM, data tasks</text>

<rect x="590" y="218" width="240" height="74" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="710" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Python Web Frameworks</text>
<text x="710" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Django  |  Flask  |  FastAPI</text>
<text x="710" y="284" text-anchor="middle" font-size="11" fill="#166534">WSGI / ASGI routing and ORM tools</text>

<rect x="590" y="308" width="240" height="80" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
<text x="710" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">Python Runtime (CPython)</text>
<text x="710" y="358" text-anchor="middle" font-size="12" fill="#854d0e">Python 3.14 / 3.15 interpreter</text>
<text x="710" y="376" text-anchor="middle" font-size="11" fill="#713f12">Standard library + OS / network</text>

<text x="450" y="438" text-anchor="middle" font-size="13" fill="#374151">Interview tip: "Node.js is a JavaScript runtime built on V8; Express is a web framework that runs on Node.js."</text>
</svg>
