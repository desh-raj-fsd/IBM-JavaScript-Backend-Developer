<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect width="900" height="600" fill="#ffffff"/>

  <!-- Header -->
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">Client-Server Web Architecture &amp; Request-Response Flow</text>
  <text x="450" y="68" text-anchor="middle" font-size="14" fill="#6b7280">How browsers request resources, resolve DNS, and receive static &amp; dynamic content</text>

  <!-- Step 1: User / Browser (Client Side) -->
  <rect x="40" y="100" width="240" height="460" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="55" y="115" width="210" height="36" rx="8" fill="#e2e8f0"/>
  <circle cx="72" cy="133" r="5" fill="#ef4444"/>
  <circle cx="87" cy="133" r="5" fill="#f59e0b"/>
  <circle cx="102" cy="133" r="5" fill="#10b981"/>
  <rect x="118" y="123" width="135" height="20" rx="4" fill="#ffffff"/>
  <text x="125" y="137" font-size="11" fill="#475569">https://www.ibm.com</text>

  <text x="160" y="175" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Client (Web Browser)</text>
  <text x="160" y="195" text-anchor="middle" font-size="12" fill="#64748b">Chrome, Edge, Firefox, Safari</text>

  <!-- Browser inner boxes -->
  <rect x="60" y="215" width="200" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="70" y="238" font-size="13" font-weight="bold" fill="#1e293b">1. URL Navigation</text>
  <text x="70" y="258" font-size="11" fill="#64748b">User enters target address</text>
  <text x="70" y="272" font-size="11" fill="#64748b">Extracts domain &amp; scheme</text>

  <rect x="60" y="295" width="200" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="70" y="318" font-size="13" font-weight="bold" fill="#1e293b">2. DOM Construction</text>
  <text x="70" y="338" font-size="11" fill="#64748b">Parses HTML structure</text>
  <text x="70" y="352" font-size="11" fill="#64748b">Builds Document Object Model</text>

  <rect x="60" y="375" width="200" height="65" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="70" y="398" font-size="13" font-weight="bold" fill="#1e293b">3. CSSOM &amp; Styling</text>
  <text x="70" y="418" font-size="11" fill="#64748b">Applies CSS layout rules</text>
  <text x="70" y="432" font-size="11" fill="#64748b">Renders colors and fonts</text>

  <rect x="60" y="455" width="200" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="70" y="478" font-size="13" font-weight="bold" fill="#1e293b">4. JavaScript Engine</text>
  <text x="70" y="498" font-size="11" fill="#64748b">Executes client logic</text>
  <text x="70" y="512" font-size="11" fill="#64748b">Handles user clicks &amp; inputs</text>
  <text x="70" y="526" font-size="11" fill="#64748b">Calls APIs via fetch()</text>

  <!-- Network / Internet Layer (Middle Column) -->
  <rect x="330" y="100" width="240" height="460" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">Network &amp; Security Layer</text>
  <text x="450" y="152" text-anchor="middle" font-size="12" fill="#3b82f6">Internet Routing &amp; Encryption</text>

  <!-- DNS Step Box -->
  <rect x="350" y="175" width="200" height="75" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="360" y="198" font-size="13" font-weight="bold" fill="#1e3a8a">DNS Resolution</text>
  <text x="360" y="218" font-size="11" fill="#475569">Domain: www.ibm.com</text>
  <text x="360" y="234" font-size="11" font-weight="bold" fill="#2563eb">→ IP: 104.18.25.10</text>

  <!-- TCP/TLS Step Box -->
  <rect x="350" y="265" width="200" height="75" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="360" y="288" font-size="13" font-weight="bold" fill="#1e3a8a">TCP &amp; TLS 1.3 Handshake</text>
  <text x="360" y="308" font-size="11" fill="#475569">• SYN / SYN-ACK / ACK</text>
  <text x="360" y="324" font-size="11" fill="#475569">• Port 443 Encrypted Tunnel</text>

  <!-- HTTP Request -->
  <rect x="350" y="355" width="200" height="85" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="360" y="378" font-size="12" font-weight="bold" fill="#065f46">HTTP Request (Client → Server)</text>
  <text x="360" y="398" font-size="11" font-family="monospace" fill="#047857">GET /index.html HTTP/2</text>
  <text x="360" y="414" font-size="11" font-family="monospace" fill="#047857">Host: www.ibm.com</text>
  <text x="360" y="430" font-size="11" font-family="monospace" fill="#047857">Accept: text/html,application/json</text>

  <!-- HTTP Response -->
  <rect x="350" y="455" width="200" height="85" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="360" y="478" font-size="12" font-weight="bold" fill="#991b1b">HTTP Response (Server → Client)</text>
  <text x="360" y="498" font-size="11" font-family="monospace" fill="#b91c1c">HTTP/2 200 OK</text>
  <text x="360" y="514" font-size="11" font-family="monospace" fill="#b91c1c">Content-Type: text/html</text>
  <text x="360" y="530" font-size="11" font-family="monospace" fill="#b91c1c">&lt;Payload: HTML / CSS / JS / JSON&gt;</text>

  <!-- Connecting Lines between Client and Network -->
  <line x1="280" y1="395" x2="330" y2="395" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3"/>
  <line x1="330" y1="495" x2="280" y2="495" stroke="#ef4444" stroke-width="2.5"/>

  <!-- Server Side (Right Column) -->
  <rect x="620" y="100" width="240" height="460" rx="14" fill="#fdf4ff" stroke="#c084fc" stroke-width="2"/>
  <text x="740" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#7e22ce">Server (Remote Host)</text>
  <text x="740" y="152" text-anchor="middle" font-size="12" fill="#a855f7">Web &amp; Cloud Infrastructure</text>

  <!-- Static Content Box -->
  <rect x="640" y="175" width="200" height="105" rx="8" fill="#ffffff" stroke="#e879f9" stroke-width="1.5"/>
  <text x="650" y="198" font-size="13" font-weight="bold" fill="#86198f">Static Content Store</text>
  <text x="650" y="218" font-size="11" fill="#701a75">• Stored on Server Disk / CDN</text>
  <text x="650" y="234" font-size="11" fill="#701a75">• HTML files, CSS stylesheets</text>
  <text x="650" y="250" font-size="11" fill="#701a75">• Images, logos, JavaScript files</text>
  <text x="650" y="266" font-size="11" font-weight="bold" fill="#a21caf">→ Returned directly with 0 compute</text>

  <!-- Dynamic Logic Box -->
  <rect x="640" y="295" width="200" height="115" rx="8" fill="#ffffff" stroke="#e879f9" stroke-width="1.5"/>
  <text x="650" y="318" font-size="13" font-weight="bold" fill="#86198f">Dynamic Application Engine</text>
  <text x="650" y="338" font-size="11" fill="#701a75">• Node.js / Express runtime</text>
  <text x="650" y="354" font-size="11" fill="#701a75">• Authentication &amp; session check</text>
  <text x="650" y="370" font-size="11" fill="#701a75">• Business logic calculation</text>
  <text x="650" y="386" font-size="11" fill="#701a75">• Executes database queries</text>
  <text x="650" y="402" font-size="11" font-weight="bold" fill="#a21caf">→ Generates response on-demand</text>

  <!-- Database Box -->
  <rect x="640" y="425" width="200" height="115" rx="8" fill="#ffffff" stroke="#e879f9" stroke-width="1.5"/>
  <text x="650" y="448" font-size="13" font-weight="bold" fill="#86198f">Databases (SQL &amp; NoSQL)</text>
  <text x="650" y="468" font-size="11" fill="#701a75">• Relational: PostgreSQL, MySQL</text>
  <text x="650" y="484" font-size="11" fill="#701a75">• NoSQL: MongoDB, Redis</text>
  <text x="650" y="500" font-size="11" fill="#701a75">• Managed by DBAs &amp; Developers</text>
  <text x="650" y="516" font-size="11" font-weight="bold" fill="#a21caf">→ Persistent application state</text>

  <!-- Connecting Lines between Network and Server -->
  <line x1="570" y1="395" x2="620" y2="395" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3"/>
  <line x1="620" y1="495" x2="570" y2="495" stroke="#ef4444" stroke-width="2.5"/>
</svg>
