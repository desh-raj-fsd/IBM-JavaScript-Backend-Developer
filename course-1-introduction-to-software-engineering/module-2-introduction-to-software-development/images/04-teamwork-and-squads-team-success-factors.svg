<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="540" fill="#ffffff"/>
<text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">What Makes a Team Succeed</text>
<text x="450" y="66" text-anchor="middle" font-size="14" fill="#6b7280">Left: the six factors in the lecture. Right: the five dynamics found by Google research.</text>
<rect x="30" y="90" width="410" height="420" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="235" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#115e59">Lecture: six factors</text>
<rect x="50" y="142" width="370" height="46" rx="8" fill="#ffffff" stroke="#99f6e4"/>
<text x="65" y="162" font-size="13" font-weight="bold" fill="#134e4a">1. Trust and respect</text>
<text x="65" y="179" font-size="11" fill="#0f766e">Everyone contributes equitably; it grows with time</text>
<rect x="50" y="196" width="370" height="46" rx="8" fill="#ffffff" stroke="#99f6e4"/>
<text x="65" y="216" font-size="13" font-weight="bold" fill="#134e4a">2. Agreed goals</text>
<text x="65" y="233" font-size="11" fill="#0f766e">The whole team knows what it works towards</text>
<rect x="50" y="250" width="370" height="46" rx="8" fill="#ffffff" stroke="#99f6e4"/>
<text x="65" y="270" font-size="13" font-weight="bold" fill="#134e4a">3. Agreed roles</text>
<text x="65" y="287" font-size="11" fill="#0f766e">No duplicated effort, no missed tasks</text>
<rect x="50" y="304" width="370" height="46" rx="8" fill="#ffffff" stroke="#99f6e4"/>
<text x="65" y="324" font-size="13" font-weight="bold" fill="#134e4a">4. Work with strengths</text>
<text x="65" y="341" font-size="11" fill="#0f766e">Use each person's talent, and let people grow</text>
<rect x="50" y="358" width="370" height="46" rx="8" fill="#ffffff" stroke="#99f6e4"/>
<text x="65" y="378" font-size="13" font-weight="bold" fill="#134e4a">5. Celebrate success, analyze problems</text>
<text x="65" y="395" font-size="11" fill="#0f766e">Share wins; learn from failures without blame</text>
<rect x="50" y="412" width="370" height="46" rx="8" fill="#ffffff" stroke="#99f6e4"/>
<text x="65" y="432" font-size="13" font-weight="bold" fill="#134e4a">6. Communication that works for everyone</text>
<text x="65" y="449" font-size="11" fill="#0f766e">One agreed method; everybody sees and answers</text>
<text x="235" y="486" text-anchor="middle" font-size="12" font-style="italic" fill="#115e59">Write them down as a working agreement.</text>
<rect x="460" y="90" width="410" height="420" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="665" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">Research: five dynamics</text>
<rect x="480" y="142" width="370" height="54" rx="8" fill="#ffffff" stroke="#93c5fd"/>
<text x="495" y="163" font-size="13" font-weight="bold" fill="#1e3a8a">1. Psychological safety (most important)</text>
<text x="495" y="182" font-size="11" fill="#1d4ed8">Safe to ask, admit mistakes, share ideas</text>
<rect x="480" y="204" width="370" height="54" rx="8" fill="#ffffff" stroke="#93c5fd"/>
<text x="495" y="225" font-size="13" font-weight="bold" fill="#1e3a8a">2. Dependability</text>
<text x="495" y="244" font-size="11" fill="#1d4ed8">People finish quality work on time</text>
<rect x="480" y="266" width="370" height="54" rx="8" fill="#ffffff" stroke="#93c5fd"/>
<text x="495" y="287" font-size="13" font-weight="bold" fill="#1e3a8a">3. Structure and clarity</text>
<text x="495" y="306" font-size="11" fill="#1d4ed8">Clear goals, plan and expectations</text>
<rect x="480" y="328" width="370" height="54" rx="8" fill="#ffffff" stroke="#93c5fd"/>
<text x="495" y="349" font-size="13" font-weight="bold" fill="#1e3a8a">4. Meaning</text>
<text x="495" y="368" font-size="11" fill="#1d4ed8">The work has a personal purpose</text>
<rect x="480" y="390" width="370" height="54" rx="8" fill="#ffffff" stroke="#93c5fd"/>
<text x="495" y="411" font-size="13" font-weight="bold" fill="#1e3a8a">5. Impact</text>
<text x="495" y="430" font-size="11" fill="#1d4ed8">Members see that their work makes a difference</text>
<text x="665" y="472" text-anchor="middle" font-size="12" font-style="italic" fill="#1e3a8a">Source: Google re:Work, Project Aristotle.</text>
<text x="665" y="490" text-anchor="middle" font-size="12" font-style="italic" fill="#1e3a8a">Lecture has no "meaning" or "impact".</text>
</svg>
