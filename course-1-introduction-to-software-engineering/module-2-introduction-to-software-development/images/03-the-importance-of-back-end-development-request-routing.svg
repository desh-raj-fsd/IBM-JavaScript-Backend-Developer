<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="490" fill="#ffffff"/>
<text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Server-Side Routing, Endpoints, and HTTP Responses</text>
<text x="450" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Every client plugs into a defined back-end endpoint; missing routes return 404 Not Found</text>

<!-- Clients -->
<rect x="40" y="110" width="180" height="270" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="40" y="110" width="180" height="42" rx="14" fill="#dbeafe"/>
<text x="130" y="137" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Clients</text>
<rect x="60" y="172" width="140" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
<text x="130" y="199" text-anchor="middle" font-size="13" fill="#1e3a8a">Web Browser</text>
<rect x="60" y="236" width="140" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
<text x="130" y="263" text-anchor="middle" font-size="13" fill="#1e3a8a">Mobile App</text>
<rect x="60" y="300" width="140" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
<text x="130" y="327" text-anchor="middle" font-size="13" fill="#1e3a8a">Cloud Service</text>

<!-- Router -->
<rect x="280" y="110" width="240" height="270" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<rect x="280" y="110" width="240" height="42" rx="14" fill="#ccfbf1"/>
<text x="400" y="137" text-anchor="middle" font-size="16" font-weight="bold" fill="#115e59">Back-End Router</text>
<text x="400" y="175" text-anchor="middle" font-size="12" fill="#115e59">Matches Method + Path</text>
<rect x="300" y="192" width="200" height="44" rx="8" fill="#ffffff" stroke="#5eead4"/>
<text x="400" y="218" text-anchor="middle" font-size="12" font-family="Courier, monospace" fill="#134e4a">GET /api/products</text>
<rect x="300" y="248" width="200" height="44" rx="8" fill="#ffffff" stroke="#5eead4"/>
<text x="400" y="274" text-anchor="middle" font-size="12" font-family="Courier, monospace" fill="#134e4a">GET /api/orders</text>
<rect x="300" y="304" width="200" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
<text x="400" y="330" text-anchor="middle" font-size="12" font-family="Courier, monospace" fill="#991b1b">GET /api/unknown</text>

<!-- Outcomes -->
<rect x="580" y="110" width="280" height="84" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="720" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">200 OK — JSON Data</text>
<text x="720" y="160" text-anchor="middle" font-size="12" fill="#166534">Validated query -> DB rows</text>
<text x="720" y="178" text-anchor="middle" font-size="11" fill="#15803d">Route exists and input is valid</text>

<rect x="580" y="212" width="280" height="84" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="720" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">401 / 403 — Auth Guard</text>
<text x="720" y="262" text-anchor="middle" font-size="12" fill="#92400e">401 if not logged in</text>
<text x="720" y="280" text-anchor="middle" font-size="11" fill="#b45309">403 if user lacks permission</text>

<rect x="580" y="314" width="280" height="84" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="720" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">404 Not Found (or 405)</text>
<text x="720" y="364" text-anchor="middle" font-size="12" fill="#991b1b">404: endpoint path is missing</text>
<text x="720" y="382" text-anchor="middle" font-size="11" fill="#b91c1c">405: path exists, wrong HTTP verb</text>

<!-- Arrows -->
<line x1="220" y1="245" x2="273" y2="245" stroke="#2563eb" stroke-width="2.5"/>
<polygon points="279,245 268,239 268,251" fill="#2563eb"/>
<text x="250" y="232" text-anchor="middle" font-size="11" fill="#1e3a8a">HTTPS</text>

<line x1="500" y1="214" x2="573" y2="155" stroke="#16a34a" stroke-width="2"/>
<polygon points="579,151 567,153 574,162" fill="#16a34a"/>

<line x1="500" y1="270" x2="573" y2="255" stroke="#d97706" stroke-width="2"/>
<polygon points="579,254 567,250 570,262" fill="#d97706"/>

<line x1="500" y1="326" x2="573" y2="353" stroke="#dc2626" stroke-width="2"/>
<polygon points="579,355 570,346 567,358" fill="#dc2626"/>

<text x="450" y="446" text-anchor="middle" font-size="13" fill="#374151">Rule: validate inputs at the boundary, check permissions on the server, and return clear HTTP status codes.</text>
</svg>
