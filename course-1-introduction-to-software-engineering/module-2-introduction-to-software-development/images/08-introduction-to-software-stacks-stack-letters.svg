<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="500" fill="#ffffff"/>
<text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">Reading the Letters: LAMP, MEAN, MERN, MEVN</text>
<text x="450" y="66" text-anchor="middle" font-size="14" fill="#6b7280">Each letter is one technology. Swap one letter and you get a new stack.</text>
<text x="40" y="125" font-size="16" font-weight="bold" fill="#115e59">LAMP</text>
<rect x="130" y="95" width="160" height="50" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="210" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#115e59">L: Linux</text><text x="210" y="134" text-anchor="middle" font-size="11" fill="#134e4a">operating system</text>
<rect x="305" y="95" width="160" height="50" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="385" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#115e59">A: Apache</text><text x="385" y="134" text-anchor="middle" font-size="11" fill="#134e4a">web server</text>
<rect x="480" y="95" width="160" height="50" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="560" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#115e59">M: MySQL</text><text x="560" y="134" text-anchor="middle" font-size="11" fill="#134e4a">relational database</text>
<rect x="655" y="95" width="160" height="50" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="735" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#115e59">P: PHP</text><text x="735" y="134" text-anchor="middle" font-size="11" fill="#134e4a">language (or Perl, Python)</text>
<text x="560" y="168" text-anchor="middle" font-size="12" fill="#9a3412">swap M for PostgreSQL = LAPP</text>
<text x="40" y="245" font-size="16" font-weight="bold" fill="#1e3a8a">MEAN</text>
<rect x="130" y="215" width="160" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="210" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">M: MongoDB</text><text x="210" y="254" text-anchor="middle" font-size="11" fill="#1d4ed8">document database</text>
<rect x="305" y="215" width="160" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="385" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">E: Express</text><text x="385" y="254" text-anchor="middle" font-size="11" fill="#1d4ed8">web application framework</text>
<rect x="480" y="215" width="160" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="560" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">A: Angular</text><text x="560" y="254" text-anchor="middle" font-size="11" fill="#1d4ed8">front-end framework</text>
<rect x="655" y="215" width="160" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="735" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">N: Node.js</text><text x="735" y="254" text-anchor="middle" font-size="11" fill="#1d4ed8">JavaScript runtime</text>
<text x="40" y="325" font-size="16" font-weight="bold" fill="#9a3412">MERN</text>
<rect x="130" y="295" width="160" height="50" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="210" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">M: MongoDB</text><text x="210" y="334" text-anchor="middle" font-size="11" fill="#7c2d12">same as MEAN</text>
<rect x="305" y="295" width="160" height="50" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="385" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">E: Express</text><text x="385" y="334" text-anchor="middle" font-size="11" fill="#7c2d12">same as MEAN</text>
<rect x="480" y="295" width="160" height="50" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="560" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">R: React</text><text x="560" y="334" text-anchor="middle" font-size="11" fill="#7c2d12">a UI library, not a framework</text>
<rect x="655" y="295" width="160" height="50" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="735" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">N: Node.js</text><text x="735" y="334" text-anchor="middle" font-size="11" fill="#7c2d12">same as MEAN</text>
<text x="40" y="405" font-size="16" font-weight="bold" fill="#166534">MEVN</text>
<rect x="130" y="375" width="160" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="210" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">M: MongoDB</text><text x="210" y="414" text-anchor="middle" font-size="11" fill="#14532d">same as MEAN</text>
<rect x="305" y="375" width="160" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="385" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">E: Express</text><text x="385" y="414" text-anchor="middle" font-size="11" fill="#14532d">same as MEAN</text>
<rect x="480" y="375" width="160" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="560" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">V: Vue.js</text><text x="560" y="414" text-anchor="middle" font-size="11" fill="#14532d">front-end framework</text>
<rect x="655" y="375" width="160" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="735" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">N: Node.js</text><text x="735" y="414" text-anchor="middle" font-size="11" fill="#14532d">same as MEAN</text>
<text x="450" y="470" text-anchor="middle" font-size="13" fill="#374151">The thick boxes show the one part that changes from MEAN.</text>
</svg>
