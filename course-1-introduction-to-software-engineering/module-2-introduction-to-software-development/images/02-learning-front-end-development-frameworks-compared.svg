<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="560" fill="#ffffff"/>
<text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">Angular, React and Vue at a Glance</text>
<text x="450" y="66" text-anchor="middle" font-size="14" fill="#6b7280">Facts checked against the official sites in November 2026</text>
<!-- Angular -->
<rect x="30" y="90" width="270" height="400" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<rect x="30" y="90" width="270" height="50" rx="14" fill="#fee2e2"/>
<text x="165" y="123" text-anchor="middle" font-size="19" font-weight="bold" fill="#991b1b">Angular</text>
<text x="165" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Full framework</text>
<text x="45" y="200" font-size="12" fill="#7f1d1d">Maintained by Google, open source</text>
<text x="45" y="224" font-size="12" fill="#7f1d1d">Language: TypeScript</text>
<text x="45" y="248" font-size="12" fill="#7f1d1d">Built in: router, forms and</text>
<text x="45" y="266" font-size="12" fill="#7f1d1d">form validation, HTTP client,</text>
<text x="45" y="284" font-size="12" fill="#7f1d1d">dependency injection, CLI</text>
<text x="45" y="312" font-size="12" fill="#7f1d1d">Server rendering: supported</text>
<text x="45" y="344" font-size="12" fill="#7f1d1d">Note: AngularJS (1.x) is a</text>
<text x="45" y="362" font-size="12" fill="#7f1d1d">different, older framework.</text>
<text x="45" y="380" font-size="12" fill="#7f1d1d">Its support ended in Jan 2022.</text>
<text x="165" y="440" text-anchor="middle" font-size="12" font-style="italic" fill="#991b1b">Good fit: large, long-lived apps</text>
<text x="165" y="462" text-anchor="middle" font-size="12" font-style="italic" fill="#991b1b">that need one clear structure</text>
<!-- React -->
<rect x="315" y="90" width="270" height="400" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="315" y="90" width="270" height="50" rx="14" fill="#dbeafe"/>
<text x="450" y="123" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e3a8a">React</text>
<text x="450" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">UI library (components)</text>
<text x="330" y="200" font-size="12" fill="#1e3a8a">Created by Meta; hosted by the</text>
<text x="330" y="218" font-size="11" fill="#1e3a8a">React Foundation (Linux Foundation)</text>
<text x="330" y="242" font-size="12" fill="#1e3a8a">Language: JavaScript or TypeScript</text>
<text x="330" y="266" font-size="12" fill="#1e3a8a">Built in: components and hooks</text>
<text x="330" y="284" font-size="11" fill="#1e3a8a">Not included: routing, data loading</text>
<text x="330" y="312" font-size="12" fill="#1e3a8a">Docs advise a framework for new</text>
<text x="330" y="330" font-size="12" fill="#1e3a8a">apps: Next.js, React Router, Expo</text>
<text x="330" y="362" font-size="12" fill="#1e3a8a">Latest release seen: React 19.3</text>
<text x="330" y="380" font-size="12" fill="#1e3a8a">(9 September 2026)</text>
<text x="450" y="440" text-anchor="middle" font-size="12" font-style="italic" fill="#1e3a8a">Good fit: teams that want a big</text>
<text x="450" y="462" text-anchor="middle" font-size="12" font-style="italic" fill="#1e3a8a">ecosystem and free tool choice</text>
<!-- Vue -->
<rect x="600" y="90" width="270" height="400" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<rect x="600" y="90" width="270" height="50" rx="14" fill="#dcfce7"/>
<text x="735" y="123" text-anchor="middle" font-size="19" font-weight="bold" fill="#166534">Vue</text>
<text x="735" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Adopt step by step</text>
<text x="615" y="200" font-size="12" fill="#14532d">Independent, community-driven</text>
<text x="615" y="218" font-size="12" fill="#14532d">project; funded by sponsors</text>
<text x="615" y="242" font-size="12" fill="#14532d">Created by Evan You (2014)</text>
<text x="615" y="266" font-size="12" fill="#14532d">Current major version: Vue 3</text>
<text x="615" y="284" font-size="12" fill="#14532d">Vue 2 ended 31 December 2023</text>
<text x="615" y="312" font-size="12" fill="#14532d">Works as a script tag on one page</text>
<text x="615" y="330" font-size="12" fill="#14532d">or as a full app with a build tool</text>
<text x="615" y="362" font-size="12" fill="#14532d">Server rendering: Nuxt</text>
<text x="735" y="440" text-anchor="middle" font-size="12" font-style="italic" fill="#166534">Good fit: gentle learning curve,</text>
<text x="735" y="462" text-anchor="middle" font-size="12" font-style="italic" fill="#166534">flexible adoption</text>
<text x="450" y="525" text-anchor="middle" font-size="13" fill="#374151">Choose by team skills, needs and long-term support, not by hype. Write an ADR.</text>
</svg>
