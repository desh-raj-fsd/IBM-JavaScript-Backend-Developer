<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="480" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">Branches, Merge and Conflict in Git</text>
<text x="450" y="66" text-anchor="middle" font-size="14" fill="#6b7280">Git tracks what, when and by whom. A person resolves a conflict.</text>
<text x="40" y="150" font-size="13" font-weight="bold" fill="#115e59">main</text>
<line x1="90" y1="145" x2="840" y2="145" stroke="#0d9488" stroke-width="3"/>
<circle cx="120" cy="145" r="14" fill="#0d9488"/><text x="120" y="150" text-anchor="middle" font-size="11" fill="#fff">C1</text>
<circle cx="260" cy="145" r="14" fill="#0d9488"/><text x="260" y="150" text-anchor="middle" font-size="11" fill="#fff">C2</text>
<circle cx="540" cy="145" r="14" fill="#0d9488"/><text x="540" y="150" text-anchor="middle" font-size="11" fill="#fff">C5</text>
<circle cx="760" cy="145" r="16" fill="#16a34a"/><text x="760" y="150" text-anchor="middle" font-size="11" fill="#fff">M</text>
<text x="40" y="270" font-size="13" font-weight="bold" fill="#1e3a8a">feature</text>
<line x1="260" y1="159" x2="330" y2="260" stroke="#2563eb" stroke-width="3"/>
<line x1="330" y1="260" x2="640" y2="260" stroke="#2563eb" stroke-width="3"/>
<circle cx="360" cy="260" r="14" fill="#2563eb"/><text x="360" y="265" text-anchor="middle" font-size="11" fill="#fff">C3</text>
<circle cx="500" cy="260" r="14" fill="#2563eb"/><text x="500" y="265" text-anchor="middle" font-size="11" fill="#fff">C4</text>
<line x1="640" y1="260" x2="748" y2="160" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
<text x="140" y="108" font-size="11" fill="#475569">branch created</text>
<text x="650" y="108" font-size="11" fill="#475569">merge commit (after review)</text>
<rect x="60" y="320" width="370" height="130" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="75" y="345" font-size="13" font-weight="bold" fill="#166534">Different lines changed</text>
<text x="75" y="366" font-size="12" fill="#14532d">Git merges automatically.</text>
<text x="75" y="388" font-size="12" fill="#14532d">Every commit records the author,</text>
<text x="75" y="406" font-size="12" fill="#14532d">date and message (what, when, who).</text>
<text x="75" y="432" font-size="12" fill="#14532d">You can revert to an older version.</text>
<rect x="470" y="320" width="370" height="130" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="485" y="345" font-size="13" font-weight="bold" fill="#991b1b">Same lines changed: conflict</text>
<text x="485" y="366" font-size="12" font-family="Courier, monospace" fill="#7f1d1d">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
<text x="485" y="382" font-size="12" font-family="Courier, monospace" fill="#7f1d1d">title=Book Store</text>
<text x="485" y="398" font-size="12" font-family="Courier, monospace" fill="#7f1d1d">=======</text>
<text x="485" y="414" font-size="12" font-family="Courier, monospace" fill="#7f1d1d">title=Book Shop Pro</text>
<text x="485" y="432" font-size="12" fill="#991b1b">Git stops. A developer decides.</text>
</svg>
