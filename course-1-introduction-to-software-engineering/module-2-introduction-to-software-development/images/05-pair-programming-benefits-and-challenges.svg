<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="540" fill="#ffffff"/>
<text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">Pair Programming: Benefits and Challenges</text>
<text x="450" y="66" text-anchor="middle" font-size="14" fill="#6b7280">What the lecture lists (top line of each row) and what helps (small text)</text>
<rect x="30" y="90" width="400" height="420" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="230" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#166534">Benefits</text>
<rect x="50" y="140" width="360" height="44" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
<text x="62" y="160" font-size="12" font-weight="bold" fill="#14532d">Shares knowledge and skills</text>
<text x="62" y="176" font-size="11" fill="#166534">Faster onboarding for new members</text>
<rect x="50" y="192" width="360" height="44" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
<text x="62" y="212" font-size="12" font-weight="bold" fill="#14532d">Technical and soft skills</text>
<text x="62" y="228" font-size="11" fill="#166534">Communication and problem solving</text>
<rect x="50" y="244" width="360" height="44" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
<text x="62" y="264" font-size="12" font-weight="bold" fill="#14532d">Two sets of eyes</text>
<text x="62" y="280" font-size="11" fill="#166534">Fewer typos, logic errors and bugs</text>
<rect x="50" y="296" width="360" height="44" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
<text x="62" y="316" font-size="12" font-weight="bold" fill="#14532d">Review on the fly</text>
<text x="62" y="332" font-size="11" fill="#166534">Extra layer; does not replace formal reviews</text>
<rect x="50" y="348" width="360" height="44" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
<text x="62" y="368" font-size="12" font-weight="bold" fill="#14532d">Better approach, earlier</text>
<text x="62" y="384" font-size="11" fill="#166534">More initial ideas to choose from</text>
<rect x="50" y="400" width="360" height="44" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
<text x="62" y="420" font-size="12" font-weight="bold" fill="#14532d">Takes longer, but less rework</text>
<text x="62" y="436" font-size="11" fill="#166534">Less reviewing, testing and bug fixing</text>
<text x="230" y="480" text-anchor="middle" font-size="12" font-style="italic" fill="#166534">Measure it with your own data.</text>
<rect x="470" y="90" width="400" height="420" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="670" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#991b1b">Challenges</text>
<rect x="490" y="140" width="360" height="52" rx="8" fill="#ffffff" stroke="#fecaca"/>
<text x="502" y="160" font-size="12" font-weight="bold" fill="#7f1d1d">Long focus is exhausting</text>
<text x="502" y="178" font-size="11" fill="#991b1b">Helps: timers, breaks, about 6 hours a day at most</text>
<rect x="490" y="200" width="360" height="52" rx="8" fill="#ffffff" stroke="#fecaca"/>
<text x="502" y="220" font-size="12" font-weight="bold" fill="#7f1d1d">Schedules and commitments</text>
<text x="502" y="238" font-size="11" fill="#991b1b">Helps: agreed pairing hours, a backup partner</text>
<rect x="490" y="260" width="360" height="52" rx="8" fill="#ffffff" stroke="#fecaca"/>
<text x="502" y="280" font-size="12" font-weight="bold" fill="#7f1d1d">One person controls everything</text>
<text x="502" y="298" font-size="11" fill="#991b1b">Helps: swap on a timer, ping-pong</text>
<rect x="490" y="320" width="360" height="52" rx="8" fill="#ffffff" stroke="#fecaca"/>
<text x="502" y="340" font-size="12" font-weight="bold" fill="#7f1d1d">Personalities may clash</text>
<text x="502" y="358" font-size="11" fill="#991b1b">Helps: rotate pairs, talk about working styles</text>
<rect x="490" y="380" width="360" height="52" rx="8" fill="#ffffff" stroke="#fecaca"/>
<text x="502" y="400" font-size="12" font-weight="bold" fill="#7f1d1d">Noise from several pairs</text>
<text x="502" y="418" font-size="11" fill="#991b1b">Helps: quiet spaces, headsets, remote pairing</text>
</svg>
