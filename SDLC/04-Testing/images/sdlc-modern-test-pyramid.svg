<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">The Test Pyramid</text>
  <text x="450" y="68" text-anchor="middle" font-size="15" fill="#6b7280">Many fast, cheap tests at the bottom; few slow, expensive tests at the top</text>

  <!-- pyramid -->
  <polygon points="350,100 450,100 520,220 280,220" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="400" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">End-to-end</text>
  <text x="400" y="182" text-anchor="middle" font-size="12" fill="#7f1d1d">few</text>

  <polygon points="275,230 525,230 600,350 200,350" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="285" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">Integration</text>
  <text x="400" y="308" text-anchor="middle" font-size="13" fill="#78350f">some</text>

  <polygon points="195,360 605,360 680,480 120,480" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="415" text-anchor="middle" font-size="20" font-weight="bold" fill="#166534">Unit</text>
  <text x="400" y="440" text-anchor="middle" font-size="13" fill="#14532d">many</text>

  <!-- right labels -->
  <g font-size="14" fill="#374151">
    <text x="610" y="140" font-weight="bold">Whole system, like a user</text>
    <text x="610" y="160">minutes • Playwright</text>
    <text x="640" y="270" font-weight="bold">API + real database</text>
    <text x="640" y="290">seconds • Supertest,</text>
    <text x="640" y="308">Testcontainers</text>
    <text x="700" y="400" font-weight="bold">One function alone</text>
    <text x="700" y="420">milliseconds •</text>
    <text x="700" y="438">node:test, Jest, Vitest</text>
  </g>

  <!-- axis left -->
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <line x1="70" y1="470" x2="70" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#a2)"/>
  <text x="55" y="290" text-anchor="middle" font-size="13" fill="#6b7280" transform="rotate(-90 55 290)">slower, costlier, fewer</text>

  <rect x="120" y="500" width="660" height="44" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="450" y="528" text-anchor="middle" font-size="14" fill="#1f2937">All levels run automatically in CI on every push — a red build blocks the merge</text>
</svg>
