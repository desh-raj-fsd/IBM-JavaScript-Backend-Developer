<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="900" height="610" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="25" font-weight="bold" fill="#1f2937">Regression Testing: What Runs When</text>
  <text x="450" y="60" text-anchor="middle" font-size="14" fill="#6b7280">The whole automated suite is the regression suite; selection only makes pull requests faster</text>

  <text x="130" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">WHEN</text>
  <text x="445" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">WHAT RUNS</text>
  <text x="765" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">IF RED</text>

  <!-- Row 1: pull request -->
  <rect x="40" y="92" width="180" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="131" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Every pull request</text>
  <rect x="240" y="92" width="410" height="68" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="255" y="121" font-size="13" fill="#1f2937">Unit, integration, contract (affected if slow)</text>
  <text x="255" y="142" font-size="13" fill="#1f2937">Lint, SAST, dependency and secret scans, smoke</text>
  <rect x="670" y="92" width="190" height="68" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="765" y="131" text-anchor="middle" font-size="13" fill="#7f1d1d">Blocks the merge</text>

  <!-- Row 2: merge to main -->
  <rect x="40" y="178" width="180" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Merge to main</text>
  <rect x="240" y="178" width="410" height="68" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="255" y="207" font-size="13" font-weight="bold" fill="#1f2937">The FULL automated suite</text>
  <text x="255" y="228" font-size="13" fill="#1f2937">nothing skipped by impact analysis</text>
  <rect x="670" y="178" width="190" height="68" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="765" y="207" text-anchor="middle" font-size="13" fill="#7f1d1d">Blocks deploy</text>
  <text x="765" y="228" text-anchor="middle" font-size="13" fill="#7f1d1d">to staging</text>

  <!-- Row 3: nightly -->
  <rect x="40" y="264" width="180" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="303" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Every night</text>
  <rect x="240" y="264" width="410" height="68" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="255" y="293" font-size="13" fill="#1f2937">Full suite + slow E2E, fuzz, visual tests</text>
  <text x="255" y="314" font-size="13" fill="#1f2937">+ short load test where the project has one</text>
  <rect x="670" y="264" width="190" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="765" y="293" text-anchor="middle" font-size="13" fill="#78350f">Fixed on the</text>
  <text x="765" y="314" text-anchor="middle" font-size="13" fill="#78350f">next working day</text>

  <!-- Row 4: before a release -->
  <rect x="40" y="350" width="180" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="389" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Before a release</text>
  <rect x="240" y="350" width="410" height="68" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="255" y="379" font-size="13" fill="#1f2937">Full suite on the release commit</text>
  <text x="255" y="400" font-size="13" fill="#1f2937">+ load, DAST, accessibility on staging</text>
  <rect x="670" y="350" width="190" height="68" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="765" y="389" text-anchor="middle" font-size="13" fill="#7f1d1d">Gate G4: no release</text>

  <!-- Row 5: after deploy -->
  <rect x="40" y="436" width="180" height="68" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">After deploy</text>
  <rect x="240" y="436" width="410" height="68" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="255" y="465" font-size="13" fill="#1f2937">Smoke tests in staging and production</text>
  <text x="255" y="486" font-size="13" fill="#1f2937">+ GET /version shows the new version</text>
  <rect x="670" y="436" width="190" height="68" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="765" y="475" text-anchor="middle" font-size="13" fill="#7f1d1d">Roll back on failure</text>

  <!-- flow arrows between rows -->
  <g stroke="#4b5563" stroke-width="2" marker-end="url(#arr)">
    <line x1="130" y1="160" x2="130" y2="176"/>
    <line x1="130" y1="246" x2="130" y2="262"/>
    <line x1="130" y1="332" x2="130" y2="348"/>
    <line x1="130" y1="418" x2="130" y2="434"/>
  </g>

  <!-- bottom: flaky tests and bug fixes -->
  <rect x="40" y="526" width="400" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="240" y="551" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">Flaky test? It never decides a release</text>
  <text x="240" y="575" text-anchor="middle" font-size="12" fill="#78350f">Fix it or quarantine it within 1 working day (rule 5)</text>
  <rect x="460" y="526" width="400" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="551" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Bug fixed? One test named BUG-ID</text>
  <text x="660" y="575" text-anchor="middle" font-size="12" fill="#14532d">Red without the fix, green with it, kept (rule 15)</text>
</svg>
