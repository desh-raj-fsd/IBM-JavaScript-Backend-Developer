<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#1f2937">Stakeholder Analysis: the Power / Interest Grid</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#6b7280">Place every stakeholder in one box; the box tells you how to involve them</text>

  <!-- axes -->
  <line x1="110" y1="510" x2="110" y2="96" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="110" y1="510" x2="610" y2="510" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="80" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151" transform="rotate(-90 80 305)">Power (influence over scope and money)</text>
  <text x="360" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">Interest (how much the result affects them)</text>
  <text x="96" y="114" text-anchor="end" font-size="12" fill="#6b7280">high</text>
  <text x="96" y="500" text-anchor="end" font-size="12" fill="#6b7280">low</text>
  <text x="122" y="528" font-size="12" fill="#6b7280">low</text>
  <text x="598" y="528" text-anchor="end" font-size="12" fill="#6b7280">high</text>

  <!-- quadrants -->
  <rect x="120" y="100" width="236" height="196" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="238" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#5b21b6">Keep satisfied</text>
  <text x="238" y="160" text-anchor="middle" font-size="12" fill="#4c1d95">finance director</text>
  <text x="238" y="178" text-anchor="middle" font-size="12" fill="#4c1d95">head of IT security</text>
  <text x="238" y="232" text-anchor="middle" font-size="12" font-style="italic" fill="#4c1d95">short updates; ask them</text>
  <text x="238" y="250" text-anchor="middle" font-size="12" font-style="italic" fill="#4c1d95">at key decisions only</text>

  <rect x="366" y="100" width="236" height="196" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="484" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">Manage closely</text>
  <text x="484" y="160" text-anchor="middle" font-size="12" fill="#7f1d1d">sponsor</text>
  <text x="484" y="178" text-anchor="middle" font-size="12" fill="#7f1d1d">client decision-maker</text>
  <text x="484" y="196" text-anchor="middle" font-size="12" fill="#7f1d1d">Product Owner</text>
  <text x="484" y="232" text-anchor="middle" font-size="12" font-style="italic" fill="#7f1d1d">every decision, every demo;</text>
  <text x="484" y="250" text-anchor="middle" font-size="12" font-style="italic" fill="#7f1d1d">they sign off G1 and UAT</text>

  <rect x="120" y="306" width="236" height="196" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="238" y="336" text-anchor="middle" font-size="17" font-weight="bold" fill="#374151">Monitor</text>
  <text x="238" y="366" text-anchor="middle" font-size="12" fill="#374151">vendor account manager</text>
  <text x="238" y="384" text-anchor="middle" font-size="12" fill="#374151">teams next to ours</text>
  <text x="238" y="438" text-anchor="middle" font-size="12" font-style="italic" fill="#374151">check now and then;</text>
  <text x="238" y="456" text-anchor="middle" font-size="12" font-style="italic" fill="#374151">move them if things change</text>

  <rect x="366" y="306" width="236" height="196" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="484" y="336" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e40af">Keep informed</text>
  <text x="484" y="366" text-anchor="middle" font-size="12" fill="#1e3a8a">end users (personas)</text>
  <text x="484" y="384" text-anchor="middle" font-size="12" fill="#1e3a8a">customer support</text>
  <text x="484" y="402" text-anchor="middle" font-size="12" fill="#1e3a8a">operations / on-call</text>
  <text x="484" y="438" text-anchor="middle" font-size="12" font-style="italic" fill="#1e3a8a">user research, demos,</text>
  <text x="484" y="456" text-anchor="middle" font-size="12" font-style="italic" fill="#1e3a8a">release notes</text>

  <!-- forgotten groups panel -->
  <rect x="640" y="100" width="236" height="300" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="758" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">Groups people forget</text>
  <g font-size="13" fill="#78350f">
    <text x="660" y="166">• Security and compliance</text>
    <text x="660" y="194">• Legal and privacy (GDPR)</text>
    <text x="660" y="222">• Accessibility (WCAG, EAA)</text>
    <text x="660" y="250">• Operations / SRE</text>
    <text x="660" y="278">• Data and analytics</text>
    <text x="660" y="306">• Customer support</text>
    <text x="660" y="334">• Users who are not staff</text>
    <text x="660" y="362">• Regulators and partners</text>
  </g>
  <text x="758" y="388" text-anchor="middle" font-size="11" fill="#92400e">a missing group = missing requirements</text>

  <rect x="640" y="416" width="236" height="86" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="758" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Rule</text>
  <text x="758" y="466" text-anchor="middle" font-size="13" fill="#7f1d1d">many people give input,</text>
  <text x="758" y="486" text-anchor="middle" font-size="13" fill="#7f1d1d">ONE named decision-maker</text>
</svg>
