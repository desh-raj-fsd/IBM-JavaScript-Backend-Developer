<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#1f2937">How LumenVenture Works: Methodology by Project Type</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#6b7280">One default (Scrum), adjusted to the kind of work — record the choice in the project brief</text>

  <g font-size="13" font-weight="bold" fill="#374151">
    <text x="30" y="96">Project type</text>
    <text x="300" y="96">How we run it</text>
    <text x="640" y="96">Release to users</text>
  </g>
  <line x1="24" y1="106" x2="876" y2="106" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- rows -->
  <g font-size="12">
    <rect x="24" y="116" width="230" height="74" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="139" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Internal product</text>
    <text x="139" y="168" text-anchor="middle" fill="#1e3a8a">PO accepts</text>
    <text x="300" y="140" font-weight="bold" fill="#1f2937">Scrum, 2-week sprints</text>
    <text x="300" y="158" fill="#374151">Sprint Review with internal stakeholders</text>
    <text x="300" y="176" fill="#374151">forecast from throughput</text>
    <text x="640" y="148" fill="#374151">Continuous Deployment</text>
    <text x="640" y="166" fill="#374151">(any time the pipeline is green)</text>

    <rect x="24" y="200" width="230" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="139" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Client project</text>
    <text x="139" y="252" text-anchor="middle" fill="#14532d">client signs off</text>
    <text x="300" y="224" font-weight="bold" fill="#1f2937">Paid discovery → Scrum</text>
    <text x="300" y="242" fill="#374151">client joins every Sprint Review</text>
    <text x="300" y="260" fill="#374151">fixed price per phase, or T&amp;M with a cap</text>
    <text x="640" y="232" fill="#374151">Continuous Delivery</text>
    <text x="640" y="250" fill="#374151">(client approval gate)</text>

    <rect x="24" y="284" width="230" height="74" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="139" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">Prototype</text>
    <text x="139" y="336" text-anchor="middle" fill="#78350f">keep or throw away</text>
    <text x="300" y="308" font-weight="bold" fill="#1f2937">Kanban or 1-week sprints</text>
    <text x="300" y="326" fill="#374151">time-boxed; answers named questions</text>
    <text x="300" y="344" fill="#374151">light process, no production data</text>
    <text x="640" y="316" fill="#374151">Demo environment only —</text>
    <text x="640" y="334" fill="#374151">never to real users</text>

    <rect x="24" y="368" width="230" height="74" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="139" y="400" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">After go-live</text>
    <text x="139" y="420" text-anchor="middle" fill="#4b5563">support and maintenance</text>
    <text x="300" y="392" font-weight="bold" fill="#1f2937">Kanban lane with a WIP limit</text>
    <text x="300" y="410" fill="#374151">same backlog as features;</text>
    <text x="300" y="428" fill="#374151">10–20% of sprint capacity</text>
    <text x="640" y="400" fill="#374151">Hotfixes through the</text>
    <text x="640" y="418" fill="#374151">normal pipeline</text>

    <rect x="24" y="452" width="230" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="139" y="484" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">+ Regulated data</text>
    <text x="139" y="504" text-anchor="middle" fill="#4c1d95">add-on to any type</text>
    <text x="300" y="476" font-weight="bold" fill="#1f2937">Scrum + V-model discipline</text>
    <text x="300" y="494" fill="#374151">every requirement traced to a test;</text>
    <text x="300" y="512" fill="#374151">formal records — one small V per increment</text>
    <text x="640" y="484" fill="#374151">Approval gate +</text>
    <text x="640" y="502" fill="#374151">change record</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="256" y1="153" x2="292" y2="153"/>
    <line x1="256" y1="237" x2="292" y2="237"/>
    <line x1="256" y1="321" x2="292" y2="321"/>
    <line x1="256" y1="405" x2="292" y2="405"/>
    <line x1="256" y1="489" x2="292" y2="489"/>
  </g>

  <!-- never box -->
  <rect x="24" y="544" width="852" height="76" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Never, on any project</text>
  <text x="450" y="594" text-anchor="middle" font-size="13" fill="#7f1d1d">Water-Scrum-Fall (big requirements up front, "sprints", then a long test phase) · testing only at sprint end</text>
  <text x="450" y="612" text-anchor="middle" font-size="13" fill="#7f1d1d">velocity as a target · a Sprint Review used as the only release moment · retrospectives that change nothing</text>
</svg>
