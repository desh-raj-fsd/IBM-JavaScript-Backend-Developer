<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">The Four Types of Maintenance</text>
  <text x="450" y="68" text-anchor="middle" font-size="15" fill="#6b7280">ISO/IEC/IEEE 14764 — all four feed the backlog and the next loop</text>

  <!-- axis labels -->
  <text x="235" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">REACTIVE — respond to a change or failure</text>
  <text x="665" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">PROACTIVE — improve before it is needed</text>

  <text x="22" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280" transform="rotate(-90 22 205)">CORRECTIONS</text>
  <text x="22" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280" transform="rotate(-90 22 405)">ENHANCEMENTS</text>
  <!-- Corrective -->
  <rect x="40" y="115" width="390" height="180" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="235" y="148" text-anchor="middle" font-size="21" font-weight="bold" fill="#991b1b">Corrective</text>
  <text x="235" y="172" text-anchor="middle" font-size="14" fill="#7f1d1d">fix bugs and failures</text>
  <text x="235" y="206" text-anchor="middle" font-size="13" fill="#7f1d1d">lecture: "bugs missed during testing"</text>
  <text x="235" y="236" text-anchor="middle" font-size="13" fill="#374151">e.g. 500 error on long review text</text>
  <text x="235" y="262" text-anchor="middle" font-size="13" fill="#374151">urgent → hotfix / rollback</text>

  <!-- Preventive -->
  <rect x="470" y="115" width="390" height="180" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="665" y="148" text-anchor="middle" font-size="21" font-weight="bold" fill="#166534">Preventive</text>
  <text x="665" y="172" text-anchor="middle" font-size="14" fill="#14532d">stop future problems</text>
  <text x="665" y="206" text-anchor="middle" font-size="13" fill="#14532d">not in the lecture</text>
  <text x="665" y="236" text-anchor="middle" font-size="13" fill="#374151">e.g. refactor, add tests, fix slow query</text>
  <text x="665" y="262" text-anchor="middle" font-size="13" fill="#374151">pay down technical debt</text>

  <!-- Adaptive -->
  <rect x="40" y="315" width="390" height="180" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="235" y="348" text-anchor="middle" font-size="21" font-weight="bold" fill="#92400e">Adaptive</text>
  <text x="235" y="372" text-anchor="middle" font-size="14" fill="#78350f">keep working as the world changes</text>
  <text x="235" y="406" text-anchor="middle" font-size="13" fill="#78350f">not in the lecture</text>
  <text x="235" y="436" text-anchor="middle" font-size="13" fill="#374151">e.g. new Node.js LTS, new cloud, new law</text>
  <text x="235" y="462" text-anchor="middle" font-size="13" fill="#374151">certificates, base images, OS patches</text>

  <!-- Perfective -->
  <rect x="470" y="315" width="390" height="180" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="665" y="348" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e40af">Perfective</text>
  <text x="665" y="372" text-anchor="middle" font-size="14" fill="#1e3a8a">improve based on feedback</text>
  <text x="665" y="406" text-anchor="middle" font-size="13" fill="#1e3a8a">lecture: "UI issues, missing requirements,</text>
  <text x="665" y="424" text-anchor="middle" font-size="13" fill="#1e3a8a">code enhancements"</text>
  <text x="665" y="454" text-anchor="middle" font-size="13" fill="#374151">e.g. "edit my review", faster search</text>

  <!-- arrows to backlog -->
  <g stroke="#4b5563" stroke-width="2.2" fill="none">
    <line x1="235" y1="495" x2="390" y2="545" marker-end="url(#arr)"/>
    <line x1="665" y1="495" x2="510" y2="545" marker-end="url(#arr)"/>
  </g>
  <rect x="300" y="550" width="300" height="56" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="450" y="575" text-anchor="middle" font-size="17" font-weight="bold" fill="#5b21b6">Backlog → next SDLC loop</text>
  <text x="450" y="595" text-anchor="middle" font-size="12" fill="#4c1d95">prioritized with everything else</text>
</svg>
