<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="900" height="690" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">Trunk-Based Development with Small PRs</text>
  <text x="450" y="68" text-anchor="middle" font-size="15" fill="#6b7280">Short-lived branch → automated checks + review → merge to main within a day or two</text>

  <!-- main line -->
  <line x1="60" y1="150" x2="850" y2="150" stroke="#1e40af" stroke-width="6" stroke-linecap="round"/>
  <text x="60" y="125" font-size="16" font-weight="bold" fill="#1e40af">main (trunk) — always deployable</text>
  <g fill="#1e40af">
    <circle cx="120" cy="150" r="10"/><circle cx="260" cy="150" r="10"/>
    <circle cx="700" cy="150" r="12" fill="#16a34a"/><circle cx="800" cy="150" r="10"/>
  </g>
  <text x="700" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">merge</text>

  <!-- branch -->
  <path d="M260 150 Q 300 240 360 240 L 600 240 Q 660 240 700 150" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <g fill="#7c3aed"><circle cx="390" cy="240" r="8"/><circle cx="470" cy="240" r="8"/><circle cx="550" cy="240" r="8"/></g>
  <text x="470" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">feat/rating — 1 to 2 days, small commits</text>
  <text x="390" y="225" text-anchor="middle" font-size="11" fill="#4c1d95">feat:</text>
  <text x="470" y="225" text-anchor="middle" font-size="11" fill="#4c1d95">test:</text>
  <text x="550" y="225" text-anchor="middle" font-size="11" fill="#4c1d95">docs:</text>

  <!-- PR box -->
  <line x1="470" y1="282" x2="470" y2="318" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="290" y="323" width="360" height="54" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="470" y="347" text-anchor="middle" font-size="17" font-weight="bold" fill="#5b21b6">Pull request</text>
  <text x="470" y="366" text-anchor="middle" font-size="12" fill="#4c1d95">template: what, why, how to test, checklist</text>

  <line x1="380" y1="377" x2="260" y2="418" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="560" y1="377" x2="640" y2="418" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- CI checks -->
  <rect x="90" y="423" width="340" height="150" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="260" y="450" text-anchor="middle" font-size="16" font-weight="bold" fill="#075985">Automated checks (CI)</text>
  <g font-size="13" fill="#0c4a6e">
    <text x="112" y="478">✓ ESLint + Prettier + type check</text>
    <text x="112" y="500">✓ unit + integration tests</text>
    <text x="112" y="522">✓ npm audit, secret + SAST scan</text>
    <text x="112" y="544">✓ build succeeds</text>
  </g>

  <!-- review -->
  <rect x="470" y="423" width="340" height="150" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="640" y="450" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">Human code review</text>
  <g font-size="13" fill="#78350f">
    <text x="492" y="478">✓ meets acceptance criteria</text>
    <text x="492" y="500">✓ correct edge + error cases</text>
    <text x="492" y="522">✓ secure: validation, authz, no secrets</text>
    <text x="492" y="544">✓ readable, follows the design</text>
  </g>

  <!-- branch protection gate -->
  <path d="M260 573 Q 260 615 450 615 Q 640 615 640 573" fill="none" stroke="#4b5563" stroke-width="2.2"/>
  <rect x="330" y="595" width="240" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="450" y="622" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Branch protection: all green?</text>
  <path d="M570 617 Q 860 617 860 400 Q 860 200 712 158" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="700" y="672" font-size="13" font-weight="bold" fill="#166534">yes → merge to main</text>
  
  <path d="M330 625 Q 60 660 50 560 L 50 420 Q 50 330 280 335" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#red)"/>
  <text x="60" y="672" font-size="13" fill="#991b1b">no → fix and push again</text>
  
</svg>
