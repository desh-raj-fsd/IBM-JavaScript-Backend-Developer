<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="900" height="760" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">Modern CI/CD Pipeline</text>
  <text x="450" y="68" text-anchor="middle" font-size="15" fill="#6b7280">Every change: automated checks, one image, safe release, watch, roll back if needed</text>

  <!-- CI band -->
  <rect x="40" y="90" width="820" height="250" rx="16" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="116" font-size="15" font-weight="bold" fill="#075985">CI — Continuous Integration</text>

  <g font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="70" y="135" width="170" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="155" y="160" fill="#1e40af">git push / PR</text>
    <text x="155" y="180" font-size="12" font-weight="normal" fill="#1e3a8a">small change</text>

    <rect x="290" y="135" width="250" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="415" y="160" fill="#5b21b6">Lint + type check</text>
    <text x="415" y="180" font-size="12" font-weight="normal" fill="#4c1d95">ESLint, TypeScript</text>

    <rect x="590" y="135" width="240" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="710" y="160" fill="#166534">Tests</text>
    <text x="710" y="180" font-size="12" font-weight="normal" fill="#14532d">unit + integration</text>

    <rect x="590" y="240" width="240" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="710" y="265" fill="#92400e">Security scans</text>
    <text x="710" y="285" font-size="12" font-weight="normal" fill="#78350f">SAST, npm audit, secrets</text>

    <rect x="290" y="240" width="250" height="56" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="415" y="265" fill="#3730a3">Build Docker image once</text>
    <text x="415" y="285" font-size="12" font-weight="normal" fill="#312e81">tag: book-review-api:1.5.0</text>

    <rect x="70" y="240" width="170" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="155" y="265" fill="#991b1b">Check failed?</text>
    <text x="155" y="285" font-size="12" font-weight="normal" fill="#7f1d1d">merge blocked, fix</text>
  </g>
  <g stroke="#4b5563" stroke-width="2.5" fill="none">
    <line x1="240" y1="163" x2="285" y2="163" marker-end="url(#arr)"/>
    <line x1="540" y1="163" x2="585" y2="163" marker-end="url(#arr)"/>
    <line x1="710" y1="191" x2="710" y2="235" marker-end="url(#arr)"/>
    <line x1="590" y1="268" x2="545" y2="268" marker-end="url(#arr)"/>
  </g>
  <path d="M415 191 Q 300 215 245 250" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#red)"/>
  <line x1="155" y1="240" x2="155" y2="196" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#red)"/>

  <!-- CD band -->
  <rect x="40" y="360" width="820" height="260" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="386" font-size="15" font-weight="bold" fill="#166534">CD — Continuous Delivery / Deployment</text>
  <line x1="415" y1="296" x2="415" y2="405" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>

  <g font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="290" y="410" width="250" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="415" y="435" fill="#5b21b6">Staging (UAT)</text>
    <text x="415" y="455" font-size="12" font-weight="normal" fill="#4c1d95">same image; acceptance check</text>

    <rect x="590" y="410" width="240" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="710" y="435" fill="#92400e">Approval gate</text>
    <text x="710" y="455" font-size="12" font-weight="normal" fill="#78350f">human (Delivery) or auto</text>

    <rect x="590" y="530" width="240" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="710" y="555" fill="#991b1b">Canary 5% → 100%</text>
    <text x="710" y="575" font-size="12" font-weight="normal" fill="#7f1d1d">or blue-green / rolling</text>

    <rect x="290" y="530" width="250" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="415" y="555" fill="#166534">Production</text>
    <text x="415" y="575" font-size="12" font-weight="normal" fill="#14532d">all users on 1.5.0</text>
  </g>
  <g stroke="#4b5563" stroke-width="2.5" fill="none">
    <line x1="540" y1="438" x2="585" y2="438" marker-end="url(#arr)"/>
    <line x1="710" y1="466" x2="710" y2="525" marker-end="url(#arr)"/>
    <line x1="590" y1="558" x2="545" y2="558" marker-end="url(#arr)"/>
  </g>

  <!-- monitor -->
  <line x1="415" y1="586" x2="415" y2="645" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="240" y="650" width="350" height="60" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="415" y="676" text-anchor="middle" font-size="16" font-weight="bold" fill="#075985">Monitor: logs, metrics, traces</text>
  <text x="415" y="697" text-anchor="middle" font-size="12" fill="#0c4a6e">SLO alerts • dashboards • user feedback</text>

  <!-- rollback + feedback -->
  <path d="M590 680 Q 880 680 870 560 L 835 560" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#red)"/>
  <text x="700" y="705" font-size="13" fill="#991b1b">errors? rollback in minutes</text>
  <path d="M240 680 Q 20 680 20 300 Q 20 163 65 163" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="30" y="735" font-size="13" fill="#1e40af">new stories and fixes → next change</text>
</svg>
