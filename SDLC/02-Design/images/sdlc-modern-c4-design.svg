<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="900" height="840" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f2937">C4 Model: Zooming Into the Design</text>
  <text x="450" y="68" text-anchor="middle" font-size="15" fill="#6b7280">Book Review API — Context → Containers → Components</text>

  <!-- LEVEL 1 -->
  <rect x="30" y="90" width="840" height="170" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="114" font-size="15" font-weight="bold" fill="#334155">Level 1 — Context (for everyone)</text>
  <circle cx="130" cy="170" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="130" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Reader</text>
  <rect x="320" y="140" width="260" height="70" rx="12" fill="#1e40af"/>
  <text x="450" y="172" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Book Review System</text>
  <text x="450" y="194" text-anchor="middle" font-size="12" fill="#dbeafe">the system as one box</text>
  <rect x="680" y="125" width="170" height="44" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="765" y="152" text-anchor="middle" font-size="13" fill="#374151">Identity provider</text>
  <rect x="680" y="185" width="170" height="44" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="765" y="212" text-anchor="middle" font-size="13" fill="#374151">Email service</text>
  <g stroke="#4b5563" stroke-width="2" fill="none">
    <line x1="152" y1="170" x2="315" y2="175" marker-end="url(#arr)"/>
    <line x1="580" y1="162" x2="675" y2="148" marker-end="url(#arr)"/>
    <line x1="580" y1="190" x2="675" y2="205" marker-end="url(#arr)"/>
  </g>
  <text x="235" y="162" text-anchor="middle" font-size="12" fill="#6b7280">reads, writes reviews</text>

  <!-- zoom 1 -->
  <path d="M450 210 L450 290" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="462" y="255" font-size="13" fill="#1e40af">zoom in</text>

  <!-- LEVEL 2 -->
  <rect x="30" y="295" width="840" height="230" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="319" font-size="15" font-weight="bold" fill="#166534">Level 2 — Containers (deployable parts)</text>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="60" y="345" width="180" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="150" y="372" fill="#1e40af">Web app</text>
    <text x="150" y="392" font-size="12" font-weight="normal" fill="#1e3a8a">React</text>
    <rect x="335" y="345" width="230" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="450" y="372" fill="#166534">API</text>
    <text x="450" y="392" font-size="12" font-weight="normal" fill="#14532d">Node.js + Express (stateless)</text>
    <rect x="660" y="345" width="180" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="750" y="372" fill="#92400e">Queue</text>
    <text x="750" y="392" font-size="12" font-weight="normal" fill="#78350f">emails, events</text>
    <rect x="220" y="445" width="190" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="315" y="472" fill="#5b21b6">PostgreSQL</text>
    <text x="315" y="492" font-size="12" font-weight="normal" fill="#4c1d95">source of truth</text>
    <rect x="490" y="445" width="190" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="585" y="472" fill="#991b1b">Redis</text>
    <text x="585" y="492" font-size="12" font-weight="normal" fill="#7f1d1d">cache</text>
  </g>
  <g stroke="#4b5563" stroke-width="2" fill="none">
    <line x1="240" y1="375" x2="330" y2="375" marker-end="url(#arr)"/>
    <line x1="565" y1="375" x2="655" y2="375" marker-end="url(#arr)"/>
    <line x1="410" y1="405" x2="345" y2="440" marker-end="url(#arr)"/>
    <line x1="490" y1="405" x2="555" y2="440" marker-end="url(#arr)"/>
  </g>
  <text x="285" y="365" text-anchor="middle" font-size="11" fill="#6b7280">HTTPS / JSON</text>

  <!-- zoom 2 -->
  <path d="M565 395 Q 770 410 770 560" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="782" y="535" font-size="13" fill="#166534">zoom</text>

  <!-- LEVEL 3 -->
  <rect x="30" y="565" width="840" height="260" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="589" font-size="15" font-weight="bold" fill="#5b21b6">Level 3 — Components (modules inside the API)</text>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="60"  y="610" width="240" height="52" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="180" y="632" fill="#5b21b6">Routes / controllers</text>
    <text x="180" y="650" font-size="12" font-weight="normal" fill="#4c1d95">HTTP in, validation</text>
    <rect x="330" y="610" width="240" height="52" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="450" y="632" fill="#5b21b6">Auth middleware</text>
    <text x="450" y="650" font-size="12" font-weight="normal" fill="#4c1d95">JWT check, ownership</text>
    <rect x="600" y="610" width="240" height="52" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="720" y="632" fill="#5b21b6">Error handler</text>
    <text x="720" y="650" font-size="12" font-weight="normal" fill="#4c1d95">Problem Details JSON</text>
    <rect x="60"  y="700" width="240" height="52" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="180" y="722" fill="#5b21b6">Review service</text>
    <text x="180" y="740" font-size="12" font-weight="normal" fill="#4c1d95">business rules</text>
    <rect x="330" y="700" width="240" height="52" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="450" y="722" fill="#5b21b6">Review repository</text>
    <text x="450" y="740" font-size="12" font-weight="normal" fill="#4c1d95">SQL queries only</text>
    <rect x="600" y="700" width="240" height="52" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="720" y="722" fill="#5b21b6">Email adapter</text>
    <text x="720" y="740" font-size="12" font-weight="normal" fill="#4c1d95">swap provider later</text>
  </g>
  <g stroke="#4b5563" stroke-width="2" fill="none">
    <line x1="180" y1="662" x2="180" y2="695" marker-end="url(#arr)"/>
    <line x1="300" y1="726" x2="325" y2="726" marker-end="url(#arr)"/>
    <path d="M180 752 Q 450 805 715 755" marker-end="url(#arr)"/>
  </g>
  <text x="450" y="812" text-anchor="middle" font-size="13" fill="#6b7280">Level 4 — Code (classes, functions): usually generated by tools, rarely drawn</text>
</svg>
